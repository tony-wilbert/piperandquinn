    // Shrink a photo to 1536px on its long side and return it as a JPEG data URI.
    function fitPhoto(file) {
      return new Promise(function(resolve, reject) {
        if (!file || (file.type && file.type.indexOf('image/') !== 0)) {
          reject(new Error("that file isn't a photo. try a jpg or png."));
          return;
        }
        var src = URL.createObjectURL(file);
        var img = new Image();
        img.onload = function() {
          var w = img.naturalWidth, hgt = img.naturalHeight;
          if (Math.min(w, hgt) < 256) {
            URL.revokeObjectURL(src);
            reject(new Error('that photo is too small. try a bigger one.'));
            return;
          }
          var scale = Math.min(1, 1536 / Math.max(w, hgt));
          var canvas = document.createElement('canvas');
          canvas.width = Math.round(w * scale);
          canvas.height = Math.round(hgt * scale);
          var ctx = canvas.getContext('2d');
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.imageSmoothingQuality = 'high';
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          URL.revokeObjectURL(src);
          var out = '';
          var qualities = [0.9, 0.8, 0.7];
          for (var i = 0; i < qualities.length; i++) {
            out = canvas.toDataURL('image/jpeg', qualities[i]);
            if (out.length < 2400000) break;
          }
          if (out.indexOf('data:image/jpeg') !== 0 || out.length >= 2400000) {
            reject(new Error("we couldn't get that photo ready. try a different one."));
            return;
          }
          resolve(out);
        };
        img.onerror = function() {
          URL.revokeObjectURL(src);
          reject(new Error("we couldn't open that photo. try a jpg or png."));
        };
        img.src = src;
      });
    }

    // One request to a try-on address. Resolves with the answer, or rejects with an Error
    // whose message says what went wrong. err.retry means the trouble may pass on its own.
    function tryonAsk(url, opts) {
      return fetch(url, opts).then(function(res) {
        return res.text().then(function(text) {
          var data = null;
          try { data = JSON.parse(text); } catch (e) { data = null; }
          if (res.ok && data && data.ok) return data;
          var err;
          if (data && data.message) {
            err = new Error(data.message);
            err.retry = !!data.retry;
            err.code = String(data.code || '');
          } else if (res.status === 429) {
            err = new Error("that's a lot of looks at once. wait a minute and try again.");
            err.retry = true;
          } else if (res.status === 404) {
            err = new Error("try-on isn't switched on for this site yet.");
            err.code = 'not_on';
          } else {
            err = new Error('try-on had a problem (' + res.status + '). try again.');
            err.retry = res.status >= 500;
          }
          throw err;
        });
      }, function() {
        var err = new Error("couldn't reach try-on. check your connection and try again.");
        err.retry = true;
        throw err;
      });
    }

    // Keep asking until the look is done. `alive` goes false when the shopper has moved on.
    function tryonWait(id, started, alive) {
      var misses = 0;
      return new Promise(function(resolve, reject) {
        var ask = function() {
          if (!alive()) return;
          if (Date.now() - started > TRYON_GIVE_UP) {
            reject(new Error('this is taking too long. try again.'));
            return;
          }
          tryonAsk(TRYON_STATUS + '?id=' + encodeURIComponent(id)).then(function(d) {
            misses = 0;
            if (d.state === 'done' && d.image) {
              resolve(d.image);
              return;
            }
            setTimeout(ask, TRYON_ASK_EVERY);
          }, function(err) {
            misses += 1;
            if (err.retry && misses < 4) {
              setTimeout(ask, TRYON_ASK_EVERY);
              return;
            }
            reject(err);
          });
        };
        setTimeout(ask, TRYON_ASK_EVERY);
      });
    }

    // Make one look: put the pieces on, one pass each. The picture from one pass is the
    // photo for the next. Resolves with the last picture.
    function tryonLook(pieces, photo, alive) {
      var step = function(i, picture) {
        if (i >= pieces.length) return Promise.resolve(picture);
        if (picture.indexOf('data:image/') !== 0) {
          return Promise.reject(new Error("try-on couldn't put on the second piece. try again."));
        }
        var started = Date.now();
        return tryonAsk(TRYON_START, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ product: pieces[i].id, photo: picture })
        }).then(function(d) {
          return tryonWait(d.id, started, alive);
        }).then(function(image) {
          return step(i + 1, image);
        });
      };
      return step(0, photo);
    }

    // ===== MY PHOTO =====
    // She adds her photo once. The page keeps it on her own device, with every look made
    // from it, so it is there on every piece and on her next visit. The site keeps nothing:
    // her photo goes to /api/tryon each time a look is made, and a picture comes back.
    //
    // meStore is the device's side of it (IndexedDB). Every call answers; none throws.
    // What is kept: 'photo' -> { id, image, auto, at } and 'look:<piece id>' -> { photo, image }.
    var meStore = (function() {
      var db = null, shut = false;
      var open = function() {
        if (db || shut) return Promise.resolve(db);
        return new Promise(function(resolve) {
          var done = function(got) { db = got || null; shut = !got; resolve(db); };
          try {
            var req = window.indexedDB.open('pq-me', 1);
            req.onupgradeneeded = function() { req.result.createObjectStore('kept'); };
            req.onsuccess = function() { done(req.result); };
            req.onerror = function() { done(null); };
            req.onblocked = function() { done(null); };
          } catch (e) { done(null); }
        });
      };
      // One piece of work in the store. `what` does it, and may give back a function that
      // reads the answer once the work is done. Answers null when the device will not have it.
      var work = function(mode, what) {
        return open().then(function(d) {
          if (!d) return null;
          return new Promise(function(resolve) {
            try {
              var t = d.transaction('kept', mode);
              var got = what(t.objectStore('kept'));
              t.oncomplete = function() { resolve(got ? got() : true); };
              t.onerror = function() { resolve(null); };
              t.onabort = function() { resolve(null); };
            } catch (e) { resolve(null); }
          });
        });
      };
      return {
        // Everything kept, as { key: value }. null: this device keeps nothing.
        all: function() {
          return work('readonly', function(s) {
            var keys = s.getAllKeys(), values = s.getAll();
            return function() {
              var kept = {};
              keys.result.forEach(function(k, i) { kept[k] = values.result[i]; });
              return kept;
            };
          });
        },
        put: function(key, value) { return work('readwrite', function(s) { s.put(value, key); }); },
        clear: function() { return work('readwrite', function(s) { s.clear(); }); },
      };
    })();

    // A look is made for every piece on its own for the first photos of a day on one
    // device. Each look costs. After that a new photo is still kept, and she tries a piece
    // on with a tap. One device never has more than LOOKS_OWN_A_DAY looks made on their own in
    // a day, whatever else happens: past that, every look waits for her tap. A look that could
    // not be made costs nothing, and is not counted.
    var LOOKS_PHOTOS_A_DAY = 3;
    var LOOKS_OWN_A_DAY = 30;
    var LOOKS_AT_ONCE = 2;           // looks being made at the same time
    var LOOKS_RETRY_AFTER = 20000;   // ms before a look that met passing trouble is tried again
    var LOOKS_TRIES = 3;             // times the page tries a look on its own before it waits for her
    // Trouble with the photo itself, or with try-on as a whole. No other piece would fare
    // better, so the looks stop there and she is told.
    var LOOKS_PHOTO_TROUBLE = { no_pose: 1, photo_unreadable: 1, photo_refused: 1, photo_too_big: 1, not_a_photo: 1, no_photo: 1 };
    var LOOKS_DOWN = { out_of_credit: 1, key_rejected: 1, not_set_up: 1, wrong_site: 1, not_on: 1 };
    var looksCounted = { day: '', n: 0, looks: 0 };   // the count, when the browser will not keep it

    // What this device has had made on its own today: n photos, and so many looks.
    function looksToday() {
      var d = new Date();
      var day = d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
      var kept = null;
      try { kept = JSON.parse(window.localStorage.getItem('pq-auto') || 'null'); } catch (e) { kept = null; }
      var now = kept && kept.day === day ? kept : looksCounted.day === day ? looksCounted : null;
      return { day: day, n: now ? (now.n | 0) : 0, looks: now ? (now.looks | 0) : 0 };
    }
    function looksCount(photos, looks) {
      var now = looksToday();
      looksCounted = { day: now.day, n: now.n + photos, looks: Math.max(0, now.looks + looks) };
      try { window.localStorage.setItem('pq-auto', JSON.stringify(looksCounted)); } catch (e) {}
    }

    // May the looks for a new photo be made on their own? Counts the photo if so.
    function looksOnTheirOwn() {
      var now = looksToday();
      if (now.n >= LOOKS_PHOTOS_A_DAY || now.looks >= LOOKS_OWN_A_DAY) return false;
      looksCount(1, 0);
      return true;
    }

    // May one more look be started on its own? Counts it if so.
    function lookOnItsOwn() {
      if (looksToday().looks >= LOOKS_OWN_A_DAY) return false;
      looksCount(0, 1);
      return true;
    }

    // Where her photo goes and where it is kept, in words. `kept` false: this device will
    // not keep it.
    function meNote(kept) {
      return kept === false
        ? "your photo goes to fashn, our try-on partner, to make each picture. we don't keep it, and it's gone when you close this page."
        : "your photo goes to fashn, our try-on partner, to make each picture. we don't keep it. it's saved on this device, and you can remove it any time.";
    }

    // How her looks stand, in a line: for the shop and for "my photo".
    function meWords(me) {
      var pieces = PRODUCTS.filter(function(p) { return p.tryOn; });
      var made = pieces.filter(function(p) { var e = me.looks[p.id]; return !!(e && e.image); }).length;
      var going = pieces.some(function(p) { var e = me.looks[p.id]; return !!e && (e.state === 'making' || e.state === 'waiting'); });
      // her looks are made on their own, and one could not be made
      var missed = me.auto && pieces.some(function(p) { var e = me.looks[p.id]; return !!e && e.state === 'failed' && !e.image; });
      var words;
      if (me.halted) words = me.halted.words;
      else if (going) words = 'putting every piece on you. ' + made + ' of ' + pieces.length + ' ready.';
      else if (made === pieces.length) words = 'every piece is on you.';
      else if (missed) words = made ? made + ' of ' + pieces.length + " pieces are on you. the rest didn't come through." : "your looks didn't come through.";
      else if (made) words = made + ' of ' + pieces.length + ' pieces are on you. open another to try it on.';
      else words = 'your photo is in. open a piece to try it on.';
      return {
        words: words, made: made, going: going && !me.halted, bad: !!me.halted,
        // "try again" puts every piece that has no look back in line
        again: me.auto && !going && (me.halted ? me.halted.kind === 'down' : missed),
      };
    }

    // In the shop: the way to see every piece on her, and how that is going.
    function MeBand({ me, meDo }) {
      if (!me.ready) return null;
      if (!me.photo) {
        return el('div', { className: 'me-band' },
          el('div', { className: 'me-band-words' + (me.trouble ? ' bad' : ''), role: 'status' },
            me.trouble || 'see every piece on you. add a full-length photo of you, facing the camera.',
            !me.trouble && el('span', { className: 'me-band-fine' }, meNote(me.kept))),
          el('div', { className: 'me-band-acts' },
            el('button', { type: 'button', className: 'btn-quiet me-add', disabled: me.reading, onClick: meDo.pick }, me.reading ? 'opening your photo…' : 'add my photo')));
      }
      var how = meWords(me);
      return el('div', { className: 'me-band' },
        el('img', { className: 'me-band-thumb', src: me.photo, alt: 'your photo' }),
        el('div', { className: 'me-band-words' + (me.trouble || how.bad ? ' bad' : ''), role: 'status' }, me.trouble || how.words),
        el('div', { className: 'me-band-acts' },
          me.halted && me.halted.kind === 'photo' && el('button', { type: 'button', className: 'btn-quiet me-add', disabled: me.reading, onClick: meDo.pick }, me.reading ? 'opening your photo…' : 'choose another photo'),
          how.again && el('button', { type: 'button', className: 'btn-quiet me-again', onClick: meDo.resume }, 'try again'),
          how.made > 0 && el('div', { className: 'me-switch', role: 'group', 'aria-label': 'what the shop shows' },
            el('button', { type: 'button', className: 'tryon-view-btn' + (me.show ? ' active' : ''), 'aria-pressed': me.show, onClick: function() { meDo.show(true); } }, 'on me'),
            el('button', { type: 'button', className: 'tryon-view-btn' + (!me.show ? ' active' : ''), 'aria-pressed': !me.show, onClick: function() { meDo.show(false); } }, 'the pieces')),
          el('button', { type: 'button', className: 'tryon-link me-open', onClick: meDo.open }, 'my photo')),
        how.going && el('div', { className: 'tryon-bar' }));
    }

    // "my photo": what is kept, where, and the two things she can do with it.
    function MePanel({ me, meDo, onClose }) {
      const [removed, setRemoved] = useState(false);
      useEffect(function() {
        var onKey = function(e) { if (e.key === 'Escape') onClose(); };
        document.addEventListener('keydown', onKey);
        return function() { document.removeEventListener('keydown', onKey); };
      }, []);
      var how = meWords(me);
      return el('div', { className: 'modal-overlay', onClick: function(e) { if (e.target === e.currentTarget) onClose(); } },
        el('div', { className: 'me-sheet', role: 'dialog', 'aria-label': 'my photo' },
          el('button', { className: 'modal-close', onClick: onClose, 'aria-label': 'close' }, '×'),
          el('h2', { className: 'me-sheet-title' }, 'my photo'),
          me.photo ? (
            el('div', { className: 'me-sheet-row' },
              el('img', { className: 'me-sheet-photo', src: me.photo, alt: 'your photo' }),
              el('div', null,
                el('div', { className: 'me-sheet-says' + (me.trouble || how.bad ? ' bad' : ''), role: 'status' }, me.trouble || how.words),
                el('div', { className: 'me-sheet-links' },
                  el('button', { type: 'button', className: 'tryon-link', disabled: me.reading, onClick: meDo.pick }, me.reading ? 'opening your photo…' : 'change photo'),
                  el('button', { type: 'button', className: 'tryon-link', disabled: me.reading, onClick: function() { meDo.removePhoto(); setRemoved(true); } }, 'remove photo'))))
          ) : (
            el('div', null,
              el('div', { className: 'me-sheet-says' + (me.trouble ? ' bad' : ''), role: 'status' },
                me.trouble || (removed ? 'your photo and your looks are gone from this device.' : 'no photo yet. add one to see every piece on you.')),
              el('button', { type: 'button', className: 'btn-quiet me-add', disabled: me.reading, onClick: meDo.pick }, me.reading ? 'opening your photo…' : 'add my photo'))
          ),
          el('div', { className: 'me-sheet-fine' }, meNote(me.kept))));
    }

    // The try-on panel. `pieces` is one product, or two for an outfit (in the order they go on).
    // Her photo and her looks are the app's: `me` is how they stand, `meDo` changes them, and
    // `lookKey` says which look this panel is for. `autoGo` is a number that changes each
    // time a look should start on its own. `lookRef` is where the app reads how her look
    // here stands: none | reading (she is choosing a photo, or it is being read) | making | made.
    function TryOn({ pieces, lookKey, me, meDo, startOpen, autoGo, onDone, lookRef }) {
      const [open, setOpen] = useState(!!startOpen);
      const [reading, setReading] = useState(false);
      const [fileTrouble, setFileTrouble] = useState('');
      const [nudge, setNudge] = useState(0);
      var fileRef = React.useRef(null);
      var panelRef = React.useRef(null);
      var runRef = React.useRef(0);
      var two = pieces.length > 1;
      var photo = me.photo;
      var entry = me.looks[lookKey] || null;
      var look = (entry && entry.image) || null;
      var making = !!entry && (entry.state === 'making' || entry.state === 'waiting');
      var failed = !!entry && entry.state === 'failed';
      // Set as things happen, not as the page draws: a press can arrive before the next draw.
      var mark = function(state) { if (lookRef) lookRef.current = state; };

      // On a phone the panel can sit half off the screen. Bring it into view when she is
      // using it, so the button and any message are in front of her.
      var showPanel = function() { setNudge(function(n) { return n + 1; }); };
      useEffect(function() {
        var p = panelRef.current;
        if (!nudge || !p || !p.scrollIntoView) return;
        var calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        p.scrollIntoView({ block: 'nearest', behavior: calm ? 'auto' : 'smooth' });
      }, [nudge]);

      // Leaving the window: a photo still being read is let go. A look still being made is
      // the app's, and is not stopped from here.
      useEffect(function() {
        return function() { runRef.current = -1; };
      }, []);

      // How her look stands, for the app, as the page draws it.
      useEffect(function() {
        if (reading) return;
        mark(making ? 'making' : look ? 'made' : 'none');
      }, [making, !!look, reading]);

      // A look that could not be made: bring the reason into view.
      var wasFailed = React.useRef(failed);
      useEffect(function() {
        if (failed && !wasFailed.current) showPanel();
        wasFailed.current = failed;
      }, [failed]);

      // Her looks are being made on their own, and this one has not had its turn: it goes next.
      useEffect(function() {
        if (entry && entry.state === 'waiting') {
          mark('making');
          meDo.want(lookKey);
        }
      }, []);

      var busy = reading || making;
      var phase = reading ? 'opening' : making ? 'working' : (fileTrouble || failed) ? 'error' : 'idle';

      var pick = function() {
        if (busy || !fileRef.current) return;
        mark('reading'); // from the moment the chooser opens, she is adding or changing her photo
        fileRef.current.click();
      };

      // She shut the chooser without choosing: her look stands as it did.
      var madeRef = React.useRef(false);
      madeRef.current = !!look;
      useEffect(function() {
        var input = fileRef.current;
        if (!input) return;
        var back = function() { mark(madeRef.current ? 'made' : 'none'); };
        input.addEventListener('cancel', back);
        return function() { input.removeEventListener('cancel', back); };
      }, [open]);

      var onFile = function(e) {
        var file = e.target.files && e.target.files[0];
        e.target.value = '';
        if (!file) { mark(look ? 'made' : 'none'); return; }
        if (busy) return;
        var my = ++runRef.current;
        setReading(true);
        setFileTrouble('');
        mark('reading');
        fitPhoto(file).then(function(dataUrl) {
          if (runRef.current !== my) return;
          setReading(false);
          // a new photo: every look made from the old one goes. This piece's is started at
          // once if her looks are made on their own.
          mark(meDo.setPhoto(dataUrl, lookKey) ? 'making' : 'none');
          showPanel();
        }, function(err) {
          if (runRef.current !== my) return;
          setReading(false);
          setFileTrouble(err.message);
          mark(look ? 'made' : 'none');
          showPanel();
        });
      };

      var remove = function() {
        if (busy) return;
        runRef.current += 1;
        setFileTrouble('');
        meDo.removePhoto();
        mark('none');
      };

      var go = function() {
        if (!photo || busy) return;
        setFileTrouble('');
        mark('making');
        showPanel();
        var done = meDo.make(lookKey, pieces, false);
        if (onDone) {
          done.then(function(r) {
            if (r.gone || runRef.current === -1) return;
            onDone(r.ok, r.ok ? '' : r.words);
          });
        }
      };

      // A crew member showed this outfit and her photo is already in: start without a tap.
      useEffect(function() {
        if (autoGo && photo) go();
        else if (autoGo) mark('none');
      }, [autoGo]);

      if (!open) {
        return el('button', { className: 'tryon-open', onClick: function() { setOpen(true); showPanel(); } }, 'try it on');
      }

      var waistUp = pieces.every(function(p) { return p.category === 'tops'; });
      var tip = waistUp
        ? 'use a photo of you facing the camera, from the waist up or full length.'
        : 'use a full-length photo of you, facing the camera.';

      var status = '';
      if (phase === 'working') status = two ? 'this takes about half a minute.' : 'this takes about 15 seconds.';
      else if (phase === 'error') status = fileTrouble || entry.words;
      else if (look) status = two ? "here's your look, in the colors we photographed." : "here's your look, in the color we photographed.";

      var goLabel = 'see it on me';
      if (phase === 'working') goLabel = 'making your look…';
      else if (phase === 'error') goLabel = 'try again';
      else if (look) goLabel = 'make it again';

      var saveName = 'piper-and-quinn-' + pieces.slice().reverse().map(pieceKey).join('-') + '.jpg';

      return el('div', { className: 'tryon-panel', ref: panelRef },
        el('div', { className: 'tryon-head' },
          el('div', { className: 'tryon-title' }, 'try it on'),
          el('button', { className: 'tryon-link', onClick: function() { setOpen(false); } }, 'close')),
        el('input', { ref: fileRef, type: 'file', accept: 'image/*', onChange: onFile, className: 'tryon-file', tabIndex: -1, 'aria-hidden': 'true' }),
        photo ? (
          el(React.Fragment, null,
            el('div', { className: 'tryon-photo-row' },
              el('img', { className: 'tryon-thumb', src: photo, alt: 'your photo' }),
              el('div', { className: 'tryon-photo-links' },
                el('button', { className: 'tryon-link', disabled: busy, onClick: pick }, 'change photo'),
                el('button', { className: 'tryon-link', disabled: busy, onClick: remove }, 'remove photo'))),
            el('button', { className: 'tryon-go', disabled: busy, onClick: go }, goLabel))
        ) : (
          el(React.Fragment, null,
            el('div', { className: 'tryon-tip' }, tip),
            el('button', { className: 'tryon-go', disabled: busy, onClick: pick }, phase === 'opening' ? 'opening your photo…' : 'choose a photo'))
        ),
        phase === 'working' && el('div', { className: 'tryon-bar' }),
        el('div', { className: 'tryon-status' + (phase === 'error' ? ' tryon-error' : ''), role: 'status', 'aria-live': 'polite' }, status),
        look && !busy && el('a', { className: 'tryon-link', href: look, download: saveName, style: { display: 'inline-block' } }, 'save picture'),
        el('div', { className: 'tryon-note' }, meNote(me.kept)));
    }

    // ===== THE CREW AS GUIDES =====
    // A crew member is a voice agent at ElevenLabs. The page talks with the agent through
    // ElevenLabs' client library (vendor/), by voice or in writing, and draws the
    // conversation itself: what is said, and each piece she talks about, with its own
    // "add to cart". An agent has five buttons on this page:
    //   show_piece    put one piece on her screen, in a color if one was named
    //   show_outfit   show a dress, or a top and a bottom. If her photo is in, the page
    //                 puts the outfit on her.
    //   add_to_cart   put a piece in her cart, in the size she said
    //   go_to         take her to a page: home, shop, studio, team or cart
    //   design        put a color and a print on a piece in the studio
    // Each button answers the agent in words, because the agent cannot see the screen.
    var STYLIST_FREE_LOOKS = 5; // looks a crew member may start without her tap, per visit
    var OUTFIT_ORDER = ['bottoms', 'tops', 'dresses']; // the order pieces go on

    // "The Burgundy Polo" -> "burgundy-polo": the name the agent uses for a piece.
    function pieceKey(product) {

      // An on-screen keyboard covers the bottom of the screen without telling the page's
      // layout. Note how much, so the chat can sit above it.
      useEffect(function() {
        var vv = window.visualViewport;
        if (!vv) return;
        var note = function() {
          var covered = Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
          document.documentElement.style.setProperty('--kb', (covered > 60 ? covered : 0) + 'px');
        };
        vv.addEventListener('resize', note);
        vv.addEventListener('scroll', note);
        return function() {
          vv.removeEventListener('resize', note);
          vv.removeEventListener('scroll', note);
        };
      }, []);

      var acts = { showOutfit: handleShowOutfit, showPiece: handleShowPiece, addToCart: handleGuideAdd, goTo: handleGoTo, design: handleDesign, where: whereNow };

      return (
        el('div', null,
          el(Navbar, { currentPage: currentPage, navigateTo: navigateTo, cartCount: cart.length, photo: me.photo, onMe: function() { openMe(true); } }),
          el('input', { ref: meFile, type: 'file', accept: 'image/*', onChange: onPhotoFile, className: 'tryon-file me-file', tabIndex: -1, 'aria-hidden': 'true' }),
          el('div', { className: 'page-main' },
            currentPage === 'home' && el(HomePage, { onSelectCrewMember: handleSelectCrewMember, navigateTo: navigateTo,
              voice: guide && voice ? { name: guide.name, state: voice } : null, onTalk: talkTo, onHang: function() { crewDesk.hang(); }, guided: !!guide }),
            currentPage === 'zone' && activeZoneIdx !== null && el(CrewZone, { memberIdx: activeZoneIdx, onSelectProduct: viewPiece, onSwitchZone: handleSelectCrewMember, navigateTo: navigateTo, isGuide: guideIdx === activeZoneIdx, onGuide: function() { setGuideIdx(activeZoneIdx); }, me: me }),
            currentPage === 'shop' && el(ShopPage, { setCurrentPage: navigateTo, onSelectProduct: viewPiece, me: me, meDo: meDo }),
            currentPage === 'studio' && el(DesignStudio, { design: design, setDesign: putDesign, onSeeReal: viewPiece }),
            currentPage === 'team' && el(TeamPage, { onSelectCrewMember: handleSelectCrewMember }),
            currentPage === 'cart' && el(CartPage, { cart: cart, setCart: putCart }),
            el(Footer, { navigateTo: navigateTo })),
          outfit && el(OutfitWindow, { key: outfit.n, outfit: outfit, onClose: closeOutfit, onView: viewPiece, me: me, meDo: meDo, upRef: outfitRef }),
          piece && el(ProductDetail, {
            key: piece.n,
            ask: piece,
            onClose: function() { if (closePiece(piece.n)) tellCrew('She closed ' + piece.product.name + '.'); },
            onAddToCart: function(product, colorway, size) {
              handleAddToCart(product, colorway, size);
              tellCrew('She added ' + product.name + ' to her cart: size ' + String(size).toUpperCase() + ', in ' + colorName(colorway) + '.');
            },
            me: me,
            meDo: meDo,
          }),
          meOpen && el(MePanel, { me: me, meDo: meDo, onClose: function() { openMe(false); } }),
          guide && el(GuideChat, { key: guide.name, member: guide, onAddToCart: handleAddToCart, onView: viewFromChat, acts: acts, onClose: function() { setGuideIdx(null); }, onVoice: setVoice }))
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App, null));
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
  
</script>
</body>
</html>
