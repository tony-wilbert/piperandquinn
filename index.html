  <script>
    // Safari on a Mac can play a crew member's voice with no sound. The voice library gets
    // sound ready only on an iPhone or iPad, which it tells by touch. It looks as it loads,
    // and again at each tap. crewSound(true) has Safari on a Mac take that same step.
    // crewSound(false) undoes it. The step is on until the library has loaded, then only
    // while a crew member is with her as her guide, or her pointer or her keyboard is on a
    // "talk to" button on the home page. ElevenLabs was sent a fix
    // (github.com/elevenlabs/packages/pull/1025). It is not in 1.27.0. When a version has
    // it, take this script out and move the library on.
    (function () {
      var macSafari = false;
      try { macSafari = navigator.vendor === 'Apple Computer, Inc.' && !('ontouchend' in document); } catch (e) {}
      var loaded = false, missing = false, guide = false;
      var set = function (on) {
        if (!macSafari) return;
        try { if (on) document.ontouchend = null; else delete document.ontouchend; } catch (e) {}
      };
      window.crewSound = function (on) { guide = !!on; set(guide || !(loaded || missing)); };
      window.crewVoiceLoaded = function () { loaded = true; set(guide); };
      window.crewVoiceMissing = function () { missing = true; set(guide); };
      // where the library is: 'here', 'coming' (still loading) or 'missing' (it could not be loaded)
      window.crewVoiceState = function () { return loaded ? 'here' : missing ? 'missing' : 'coming'; };
      set(true);
    })();
  </script>

  <style>
    /* ===== THE BRAND =====
       From the piper & quinn brand style guide, version 1.0 (october 2026).
       Colors are the guide's hex values. Type is Jost: light for headlines, regular for body.
       All copy is lowercase. The wordmark is green with a sky-blue ampersand. */
    :root {
      --pq-green: #6DC067;
      --sky-blue: #ACD9F4;
      --green-grass: #B1D355;
      --orange-tee: #FBB040;
      --coral: #E8685A;
      --midnight: #1B2A4A;
      --hot-pink: #E84B8A;
      --lavender: #C4A7D7;
      --ocean: #2B7A9E;
      --sunshine: #F7D559;
      --orbit-white: #F8F6F1;
      --city-khaki: #C8B898;
      --wild-black: #2A2A2A;
      --beluga: #808080;

      --ink: var(--wild-black);
      --ink-soft: #5e5e5e;               /* wild black, lightened: small words that must be read */
      --line: rgba(42, 42, 42, 0.1);     /* wild black, as a hairline */
      --line-soft: rgba(42, 42, 42, 0.06);
      --green-press: #5fb259;            /* p&q green, a step darker: a pressed or hovered button */
      --error: #b3261e;
      --radius: 12px;
      --radius-lg: 16px;
      --shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      --shadow-up: 0 12px 32px rgba(42, 42, 42, 0.12);
    }

    * {
      font-family: 'Jost', 'system-ui', 'sans-serif';
    }

    body {
      margin: 0;
      padding: 0;
      background: #fff;
      color: var(--ink);
      font-weight: 400;
      text-transform: lowercase;
      -webkit-font-smoothing: antialiased;
    }

    /* What she types shows as she typed it. */
    input, textarea, select {
      text-transform: none;
    }

    :focus-visible {
      outline: 3px solid var(--sky-blue);
      outline-offset: 2px;
    }

    /* The wordmark: lowercase jost light, green, the ampersand in sky blue. */
    .wordmark {
      font-weight: 300;
      letter-spacing: 0.02em;
      text-transform: lowercase;
      color: var(--pq-green);
      white-space: nowrap;
    }

    .wordmark .amp {
      color: var(--sky-blue);
    }

    /* The tagline: p&q green, jost light italic, lowercase. */
    .tagline {
      font-weight: 300;
      font-style: italic;
      color: var(--pq-green);
      text-transform: lowercase;
    }

    /* The guide's rule: green, sky blue, grass, orange. */
    .color-rule {
      height: 3px;
      background: linear-gradient(90deg, var(--pq-green), var(--sky-blue), var(--green-grass), var(--orange-tee));
    }

    /* Buttons. The main one is p&q green with wild-black words. */
    .btn-primary,
    .add-to-cart-btn,
    .tryon-go {
      display: inline-block;
      padding: 13px 30px;
      background: var(--pq-green);
      color: var(--ink);
      border: none;
      border-radius: 999px;
      cursor: pointer;
      font-family: 'Jost', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: lowercase;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .btn-primary:not(:disabled):hover,
    .add-to-cart-btn:not(:disabled):hover,
    .tryon-go:not(:disabled):hover {
      background: var(--green-press);
    }

    .btn-primary:disabled,
    .add-to-cart-btn:disabled,
    .tryon-go:disabled {
      background: #e6e3dc;
      color: #8a8a8a;
      cursor: not-allowed;
    }

    .btn-note {
      margin-top: 0.75rem;
      font-size: 0.85rem;
      color: var(--ink-soft);
      min-height: 1.3em;
    }

    .page-title {
      font-size: 2.2rem;
      font-weight: 300;
      text-align: center;
      margin: 3rem 0;
      letter-spacing: 0.02em;
      color: var(--ink);
    }

    .cart-empty {
      text-align: center;
      padding: 3rem;
    }

    .cart-empty p:first-child {
      font-size: 1.1rem;
      font-weight: 300;
      margin-bottom: 0.5rem;
    }

    .cart-empty p:last-child {
      font-size: 0.9rem;
      color: var(--ink-soft);
    }

    .cart-totals {
      max-width: 700px;
      margin: 2rem auto;
      padding: 2rem 0.5rem;
      border-bottom: 1px solid var(--line);
    }

    .cart-totals > div {
      display: flex;
      justify-content: space-between;
      margin-bottom: 1rem;
      font-size: 1rem;
    }

    .cart-totals > div.soft {
      font-size: 0.875rem;
      color: var(--ink-soft);
    }

    .cart-totals > div.sum {
      font-size: 1.15rem;
      font-weight: 500;
      margin-bottom: 0;
    }

    .label {
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: lowercase;
      margin-bottom: 0.75rem;
    }

    .product-card {
      position: relative;
      overflow: hidden;
      background: #fff;
      border-radius: var(--radius);
      cursor: pointer;
    }

    .product-card-image-wrapper {
      aspect-ratio: 3/4;
      overflow: hidden;
      background: var(--orbit-white);
      border-radius: var(--radius);
    }

    .product-image {

      height: 100%;
      object-fit: cover;
      object-position: top 20%;

    .product-info {

    }

    .product-name {

      font-weight: 400;

      text-transform: lowercase;
      letter-spacing: 0.02em;
    }

    .product-price {

      font-weight: 400;

    .filter-link {
      text-transform: lowercase;
      font-size: 0.9rem;
      font-weight: 400;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: border-color 0.2s ease;
      padding-bottom: 4px;
      border-bottom: 2px solid transparent;
    }

    .filter-link.active {
      border-bottom-color: var(--pq-green);
    }

    .filter-link:hover {
      border-bottom-color: var(--sky-blue);
    }

    .filter-link.active:hover {
      border-bottom-color: var(--pq-green);
    }

    /* ===== THE DESIGN STUDIO =====
       A real piece, drawn in her color and her print. */
    .studio {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 2rem;
    }

    .studio .studio-title {
      margin: 2.5rem 0 0.35rem;
    }

    .studio-sub {
      text-align: center;
      font-size: 1.05rem;
      margin: 0 0 2.25rem;
    }

    .studio-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
      gap: 3rem;
      align-items: start;
    }

    /* The piece stays in sight while she works down the choices. */
    .studio-show {
      position: sticky;
      top: calc(var(--studio-top, var(--nav-h)) + 1.25rem);
    }

    .studio-stage {
      position: relative;
      background: var(--orbit-white);
      border-radius: var(--radius-lg);
      padding: 6%;
    }

    .studio-canvas {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: clamp(220px, calc(100vh - 19rem), 520px);
      margin: 0 auto;
    }

    @media (max-height: 560px) {
      .studio-show {
        position: static;
      }
    }

    .studio-oops {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      padding: 1rem;
      text-align: center;
      font-size: 0.95rem;
      color: var(--ink-soft);
    }

    .studio-caption {
      text-align: center;
      padding: 0.9rem 0.5rem 0;
    }

    .studio-name {
      font-size: 1.5rem;
      font-weight: 300;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    .studio-words {
      font-size: 0.9rem;
      color: var(--ink-soft);
      margin-top: 0.2rem;
    }

    .studio-show-acts {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.6rem;
      margin-top: 1rem;
    }

    .btn-quiet {
      padding: 11px 22px;
      background: #fff;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 999px;
      cursor: pointer;
      font-family: 'Jost', sans-serif;
      font-size: 0.9rem;
      font-weight: 400;
      letter-spacing: 0.04em;
      text-transform: lowercase;
      transition: border-color 0.2s ease;
    }

    .btn-quiet:not(:disabled):hover {
      border-color: var(--ink);
    }

    .btn-quiet:disabled {
      color: #8a8a8a;
      cursor: not-allowed;
    }

    /* The room under the choices is the panel's own, so the piece beside it holds its place
       to the end. */
    .studio-panel {
      min-width: 0;
      padding-bottom: 5rem;
    }

    .studio-step {
      margin: 0 0 1.75rem;
      scroll-margin-top: calc(var(--studio-top, var(--nav-h)) + var(--studio-stuck, 0px) + 0.75rem);
    }

    .studio-label {
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
      margin-bottom: 0.7rem;
      font-size: 1rem;
      font-weight: 400;
      letter-spacing: 0.02em;
      color: var(--pq-green);
    }

    .studio-picked {
      font-size: 0.85rem;
      letter-spacing: 0;
      color: var(--ink-soft);
    }

    .studio-pieces,
    .studio-prints {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.6rem;
    }

    .studio-piece,
    .studio-print {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
      padding: 0.4rem 0.3rem 0.45rem;
      background: #fff;
      border: 2px solid transparent;
      border-radius: var(--radius);
      cursor: pointer;
      font-family: 'Jost', sans-serif;
      font-size: 0.72rem;
      line-height: 1.2;
      color: var(--ink-soft);
      text-transform: lowercase;
      text-align: center;
    }

    .studio-piece {
      background: var(--orbit-white);
    }

    .studio-piece canvas {
      display: block;
      width: 100%;
      height: auto;
    }

    .studio-print canvas {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 8px;
      border: 1px solid var(--line);
    }

    .studio-piece[aria-pressed="true"],
    .studio-print[aria-pressed="true"] {
      border-color: var(--ink);
      color: var(--ink);
    }

    .studio-piece[aria-pressed="true"] {
      background: #fff;
    }

    .studio-swatches {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 44px));
      gap: 0.65rem;
    }

    /* as tall as it is wide, in every browser */
    .studio-swatch {
      width: 100%;
      height: 0;
      padding: 0 0 100%;
      border-radius: 50%;
      border: 1px solid var(--line);
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .studio-swatch:not(:disabled):hover {
      transform: scale(1.08);
    }

    .studio-swatch[aria-pressed="true"] {
      box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--ink);
    }

    /* the cloth's own color cannot be the print's: it would not show. An empty ring holds its place. */
    .studio-swatch:disabled {
      background: none !important;
      border: 1px dashed rgba(42, 42, 42, 0.3);
      cursor: not-allowed;
    }

    .studio-field {
      display: block;
      width: 100%;
      padding: 0.7rem 0.9rem;
      border: 1px solid rgba(42, 42, 42, 0.22);
      border-radius: var(--radius);
      background: #fff;
      color: var(--ink);
      font-size: 1rem;
      line-height: 1.4;
    }

    textarea.studio-field {
      min-height: 4.6rem;
      resize: vertical;
    }

    .studio-hint {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      margin-top: 0.4rem;
      font-size: 0.8rem;
      color: var(--ink-soft);
    }

    .studio-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
    }

    .studio-status {
      min-height: 1.5em;
      margin-top: 0.9rem;
      font-size: 0.95rem;
      scroll-margin: calc(var(--studio-top, var(--nav-h)) + var(--studio-stuck, 0px) + 0.75rem) 0 1.5rem;
    }

    .studio-status.bad {
      color: var(--error);
    }

    .studio-fine {
      margin-top: 0.6rem;
      font-size: 0.8rem;
      color: var(--ink-soft);
    }

    /* One column. The piece sticks under the navbar, small enough to leave the choices room.
       While she types, it lets go: the keyboard needs the space. */
    @media (max-width: 720px) {
      .studio {
        padding: 0 1rem;
      }

      .studio-panel {
        padding-bottom: 3rem;
      }

      .studio .studio-title {
        margin-top: 1.5rem;
      }

      .studio-sub {
        margin-bottom: 1rem;
      }

      .studio-grid {
        grid-template-columns: minmax(0, 1fr);
        gap: 0;
      }

      .studio-show {
        display: contents;
      }

      .studio-stick {
        position: sticky;
        top: var(--studio-top, 56px);
        z-index: 5;
        margin: 0 -1rem;
        padding: 0.5rem 1rem 0.6rem;
        background: #fff;
        border-bottom: 1px solid var(--line-soft);
      }

      .studio.typing .studio-stick {
        position: static;
      }

      .studio-stage {
        padding: 0.5rem;
      }

      .studio-canvas {
        max-height: min(30vh, 280px);
      }

      .studio-caption {
        padding-top: 0.45rem;
      }

      .studio-name {
        font-size: 1.15rem;
      }

      .studio-words {
        font-size: 0.82rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .studio-show-acts {
        margin: 0.9rem 0 1.5rem;
      }
    }

    .fade-in {
      animation: fadeIn 0.4s ease-in;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    .category-nav {
      display: flex;
      gap: 3rem;
      justify-content: center;
      margin: 2rem 0;
      flex-wrap: wrap;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 0.5rem;
      border-bottom: 1px solid var(--line);
    }

    /* the piece in her color, beside its name */
    .cart-item-main {
      display: flex;
      align-items: center;

    }

    .cart-item-shot {

    }

    .cart-item-details {
      flex: 1;

    }

    .cart-item-name {
      font-weight: 400;
      font-size: 1.05rem;
      margin-bottom: 0.4rem;
    }

    .cart-item-meta {
      font-size: 0.875rem;
      color: var(--ink-soft);
    }

    .quantity-control {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .qty-button {
      width: 34px;
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
      font-weight: 400;
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .qty-button:hover {
      background: var(--orbit-white);
      border-color: var(--ink);
    }

    .navbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255, 255, 255, 0.96);
      border-bottom: 1px solid var(--line);
    }

    .navbar-content {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1.1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .navbar-brand {
      background: none;
      border: none;
      padding: 0;
      font: inherit;
      font-size: 1.5rem;
      cursor: pointer;
    }

    .navbar-links {
      display: flex;
      gap: 2rem;
      text-transform: lowercase;
      font-weight: 400;
      font-size: 0.9rem;
      letter-spacing: 0.04em;
    }

    .navbar-link {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;

    }

    .navbar-link:hover {

    }

    }

    .footer {
      background: var(--orbit-white);
      color: var(--ink);

    }

    .footer-content {
      max-width: 1400px;
      margin: 0 auto;
      padding: 3.5rem 2rem 3rem;
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 2rem;
    }

    .footer-brand {
      font-size: 2rem;
    }

    .footer-tagline {
      font-size: 1.15rem;
      margin-top: 0.15rem;
    }

    .footer-place {
      font-size: 0.85rem;
      color: var(--ink-soft);

    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1.75rem;
      font-size: 0.9rem;
      letter-spacing: 0.04em;
    }

    .footer-link {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 0 0 2px;
      font: inherit;
      color: inherit;
      letter-spacing: inherit;

    .main-content {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 2rem;

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(42, 42, 42, 0.45);

    .modal-content {
      background: #fff;
      max-width: 960px;
      width: 100%;
      max-height: 92vh;
      overflow-y: auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      position: relative;
      border-radius: var(--radius-lg);
      box-shadow: 0 25px 50px rgba(42, 42, 42, 0.22);
    }

    .modal-close {
      position: absolute;
      top: 0.9rem;
      right: 0.9rem;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid var(--line);
      border-radius: 50%;
      font-size: 1.3rem;
      font-weight: 300;
      line-height: 1;
      cursor: pointer;
      z-index: 10;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink);
      transition: border-color 0.2s ease;
    }

    .modal-close:hover {
      border-color: var(--ink);
    }

    .modal-pane {
      overflow: hidden;
      background: var(--orbit-white);
      position: relative;
    }

    .modal-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      min-height: 400px;
      background: var(--orbit-white);
    }

    /* The piece on its own, in her color: room around it, like a product shot. */
    .modal-image.piece-shot {
      padding: 8% 8% calc(8% + 2.75rem);   /* and clear of the switch at its foot */
      box-sizing: border-box;
    }

    .modal-details {
      padding: 2.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .modal-product-name {
      font-size: 1.7rem;
      font-weight: 300;
      text-transform: lowercase;
      letter-spacing: 0.02em;
    }

    .modal-product-price {
      font-size: 1.1rem;
      color: var(--ink-soft);
    }

    .modal-product-desc {
      font-size: 0.95rem;
      color: var(--ink-soft);
      line-height: 1.6;
    }

    .size-option {
      min-width: 46px;
      padding: 8px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      cursor: pointer;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .size-option:hover {
      border-color: var(--ink);
    }

    .size-option.selected {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
    }

    .add-to-cart-btn {
      margin-top: auto;
      padding: 15px 32px;
    }

    .size-calc-toggle {
      font-size: 0.85rem;
      color: var(--ink);
      cursor: pointer;
      text-decoration: underline;
      text-decoration-color: var(--sky-blue);
      text-decoration-thickness: 2px;
      text-underline-offset: 4px;
      display: inline-block;
      margin-top: 0.6rem;
    }

    .size-calc-toggle:hover {
      text-decoration-color: var(--pq-green);
    }

    .size-calc-panel {
      background: var(--orbit-white);
      border-radius: var(--radius);
      padding: 1.25rem;
      margin-top: 0.75rem;
    }

    .size-calc-label {
      font-size: 0.78rem;
      font-weight: 500;
      text-transform: lowercase;
      letter-spacing: 0.04em;
      color: var(--ink-soft);
      margin-bottom: 0.4rem;
    }

    .size-calc-input {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      font-size: 0.9rem;
      font-family: 'Jost', sans-serif;
      background: #fff;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .size-calc-input:focus {
      border-color: var(--sky-blue);
      box-shadow: 0 0 0 3px rgba(172, 217, 244, 0.45);
    }

    .size-calc-result {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      background: #fff;
      border: 1px solid var(--pq-green);
      border-radius: 10px;
      color: var(--ink);
      font-size: 0.9rem;
      text-align: center;
      letter-spacing: 0.02em;
    }

    .size-calc-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }

    .size-calc-unit-toggle {
      display: flex;
      gap: 0;
      margin-bottom: 1rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      overflow: hidden;
      background: #fff;
    }

    .size-calc-unit-btn {
      flex: 1;
      padding: 7px 12px;
      font-size: 0.78rem;
      border: none;
      background: transparent;
      cursor: pointer;
      font-family: 'Jost', sans-serif;
      text-transform: lowercase;
      letter-spacing: 0.04em;
      color: var(--ink-soft);
      transition: background 0.2s ease, color 0.2s ease;
    }

    .size-calc-unit-btn.active {
      background: var(--ink);
      color: #fff;
    }

    .size-calc-go {
      width: 100%;
      margin-top: 0.25rem;
      padding: 11px;
      font-size: 0.85rem;
    }

    @media (max-width: 768px) {
      .modal-content {
        grid-template-columns: 1fr;
      }

      .modal-image {
        min-height: 300px;
        max-height: 50vh;
      }

      .modal-details {
        padding: 1.5rem;
      }
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    @media (prefers-reduced-motion: reduce) {
      .guide-dot {
        animation: none;
      }
    }

    @media (max-width: 768px) {
      .category-nav {
        gap: 1.5rem;
      }

      .cart-item {
        flex-direction: column;
        align-items: flex-start;
        gap: 1rem;
      }

      .quantity-control {
        width: 100%;
        justify-content: flex-start;
      }

      .page-title {
        font-size: 1.9rem;
        margin: 2.25rem 0;
      }
    }

    @media (max-width: 480px) {
      .navbar-content {
        padding: 0.8rem 1rem;
      }

      .navbar-brand {
        font-size: 1.25rem;
      }

      .navbar-links {
        gap: 0.8rem;
        font-size: 0.85rem;
      }

      .category-nav {
        gap: 1rem;
        font-size: 0.8rem;
      }

      .main-content {
        padding: 0 1rem;
      }

      .footer-content {
        padding: 2.5rem 1rem 2rem;
      }

      .footer-legal {
        padding: 1rem 1rem 1.5rem;
      }

    }

    /* On the narrowest phones the links give way, not the wordmark: the guide's least
       width for it on a screen is 120px. */
    @media (max-width: 350px) {
      .navbar-content {
        padding: 0.8rem 0.75rem;
      }

      .navbar-links {
        gap: 0.5rem;
        font-size: 0.78rem;
      }
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* A crew member with no picture yet: the first letter of the name. */
    .crew-initial {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      font-weight: 300;
      color: var(--ink);
      text-transform: lowercase;
    }

    /* ===== HOME: THE OPENING =====
       Piper and Quinn, side by side, and nobody else. Each sister is shown full length, and
       walks up and waves when the page opens. A small button on her picture lets her say
       hello, with sound. A second one starts a voice call with her, and she talks from her
       picture. Under the pictures the name of the brand is set with theirs: piper, the
       ampersand, quinn. */
    .home {
      --words: 9.75rem;   /* the room kept under the pictures for the names and the ways in */
      --tall: max(17rem, calc(100vh - var(--nav-h) - var(--words)));
      min-height: calc(100vh - var(--nav-h));
    }

    @supports (height: 100svh) {
      .home {
        --tall: max(17rem, calc(100svh - var(--nav-h) - var(--words)));
        min-height: calc(100svh - var(--nav-h));
      }
    }

    .home-stage {
      container-type: inline-size;
      container-name: home;
    }

    /* The sisters stand together in the middle of the page. Each is as tall as the screen
       allows, and never more than half the stage wide. */
    .home-pair {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
      column-gap: 3px;
    }

    /* One sister's column. Her picture and her words are one button: her way in. Over the
       picture sit two small buttons: to hear her say hello, and to talk to her. */
    .home-col {
      position: relative;
      flex: none;
      width: min(calc(var(--tall) * 31 / 54), calc(50% - 2px));
    }

    .home-sister {
      position: relative;
      width: 100%;
      display: flex;
      flex-direction: column;
      background: none;
      border: none;
      padding: 0;
      font: inherit;
      color: inherit;
      text-transform: lowercase;
      cursor: pointer;
    }

    /* the keyboard's ring, drawn over the picture so that all of it shows */
    .home-sister:focus-visible {
      outline: none;
    }

    .home-sister:focus-visible::after {
      content: '';
      position: absolute;
      top: 4px;
      right: 4px;
      bottom: 4px;
      left: 4px;
      border: 3px solid var(--sky-blue);
      box-shadow: 0 0 0 2px #fff, inset 0 0 0 2px #fff;
      pointer-events: none;
    }

    /* 31 to 54 is the shape of the stills. A clip shows the whole of its still, set a touch
       narrower, so both are stretched to this one box and the clip lies exactly on the still. */
    .home-figure {
      position: relative;
      display: block;
      width: 100%;
      aspect-ratio: 31 / 54;
      overflow: hidden;
      background: var(--line-soft);
    }

    .home-still,
    .home-clip,
    .home-say,
    .home-talk {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
    }

    /* The clip opens on the still, so it can come in at once. At its end it holds its last
       frame for a moment, then fades back to her. */
    .home-clip,
    .home-say,
    .home-talk {
      opacity: 0;
      transition: opacity 0.6s ease 0.9s;
      pointer-events: none;
    }

    .home-figure.live .home-clip,
    .home-figure.saying .home-say,
    .home-figure.talking .home-talk {
      opacity: 1;
      transition: opacity 0.15s ease;
    }

    /* Where her talking clip has to cut, the picture she was in is held over it and fades
       off, so that she eases into her next pose and does not jump. */
    .home-veil {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      pointer-events: none;
    }

    .home-veil[data-veil="on"] {
      opacity: 1;
    }

    .home-veil[data-veil="off"] {
      transition: opacity 0.3s ease;
    }

    /* Over her picture: at the top, clear of her face, the button to hear her. At the foot,
       what she is saying while she says it, and the button to talk to her. The layer itself
       takes no taps, so a tap on the picture still opens her page. */
    .home-over {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      aspect-ratio: 31 / 54;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 0.6rem;
      pointer-events: none;
    }

    .home-over-top,
    .home-over-foot {
      display: flex;
      flex-direction: column;
    }

    .home-over-top {
      align-items: flex-end;
    }

    .home-over-foot {
      align-items: center;
      gap: 0.45rem;
    }

    .home-hear {
      pointer-events: auto;
      flex: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 2.75rem;
      height: 2.75rem;
      padding: 0;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 999px;
      font: inherit;
      font-size: 0.88rem;
      letter-spacing: 0.03em;
      color: var(--ink);
      text-transform: lowercase;
      cursor: pointer;
      transition: border-color 0.2s ease;
    }

    .home-hear:hover {
      border-color: var(--zone-accent, var(--pq-green));
    }

    .home-hear:focus-visible {
      outline: 3px solid var(--sky-blue);
      outline-offset: 2px;
    }

    /* the mark: a triangle to play, a square to stop */
    .home-hear-mark {
      flex: none;
      width: 0;
      height: 0;
      margin-left: 0.15rem;   /* a triangle sits left of where the eye wants it */
      border-style: solid;
      border-width: 0.4rem 0 0.4rem 0.66rem;
      border-color: transparent transparent transparent var(--ink);
    }

    .home-hear.on .home-hear-mark {
      width: 0.7rem;
      height: 0.7rem;
      margin-left: 0;
      border: none;
      background: var(--ink);
    }

    /* on a narrow stage the button is the mark alone: its words are kept for a screen reader */
    .home-hear-word {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    @container home (min-width: 520px) {
      .home-hear {
        width: auto;
        padding: 0 1rem 0 0.85rem;
      }

      .home-hear-mark {
        margin-left: 0;
      }

      .home-hear-word {
        position: static;
        width: auto;
        height: auto;
        overflow: visible;
        clip-path: none;
      }
    }

    .home-said {
      align-self: flex-start;
      max-width: 100%;
      margin: 0;
      padding: 0.5rem 0.75rem;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 0.9rem;
      font-size: 0.88rem;
      line-height: 1.3;
      color: var(--ink);
      text-transform: lowercase;
    }

    /* As a call with her starts: that her voice is an ai's, and where what is said goes. The
       chat says the same in its small print. On a wide screen the chat is in sight beside the
       page, so the note is left to it. */
    .home-ai {
      font-size: 0.8rem;
      color: var(--ink-soft);
    }

    @media (min-width: 1100px) {
      .home-ai {
        display: none;
      }
    }

    /* At the foot of her picture: talk to her. A tap starts a voice call with her, here on
       the home page, and she talks from her picture. In a call it is the way to end it. */
    .home-call {
      pointer-events: auto;
      flex: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      max-width: 100%;
      min-height: 2.75rem;
      padding: 0 1rem;
      background: var(--ink);
      border: 1px solid var(--ink);
      border-radius: 999px;
      font: inherit;
      font-size: 0.88rem;
      font-weight: 500;
      letter-spacing: 0.03em;
      color: #fff;
      text-transform: lowercase;
      white-space: nowrap;
      cursor: pointer;
    }

    .home-call:focus-visible {
      outline: 3px solid var(--sky-blue);
      outline-offset: 2px;
    }

    .home-call.on {
      background: #fff;
      border-color: var(--line);
      color: var(--ink);
    }

    /* the mark: a microphone to talk, a square to end. On a narrow stage the microphone is
       left out, so that the words fit. */
    .home-call svg {
      display: none;
      flex: none;
      width: 15px;
      height: 15px;
    }

    .home-call-mark {
      flex: none;
      width: 0.7rem;
      height: 0.7rem;
      background: var(--ink);
    }

    @container home (min-width: 520px) {
      .home-call svg {
        display: block;
      }
    }

    /* Three rows under the pictures, level across the page: the names, the roles, the ways in. */
    .home-words,
    .home-mid-words {
      display: grid;
      grid-template-rows: 3.3rem 1.7rem 2.1rem;
      align-items: center;
      justify-items: center;
      padding: 0.75rem 0.5rem 1.9rem;
      text-align: center;
    }

    .home-words {
      position: relative;
    }

    .home-name,
    .home-amp {
      font-size: clamp(1.9rem, 5.2vw, 2.9rem);
      font-weight: 300;
      letter-spacing: 0.02em;
      line-height: 1;
    }

    .home-name {
      color: var(--pq-green);
      transition: color 0.2s ease;
    }

    .home-sister:hover .home-name {
      color: var(--green-press);
    }

    .home-amp {
      color: var(--sky-blue);
    }

    /* the wordmark's ampersand, on the seam between the two pictures and level with the names */
    .home-amp-seam {
      position: absolute;
      top: 0.75rem;
      left: calc(100% + 1.5px);
      height: 3.3rem;
      display: flex;
      align-items: center;
      transform: translateX(-50%);
      pointer-events: none;
    }

    .home-role {
      font-size: 0.85rem;
      line-height: 1.2;
      color: var(--ink-soft);
    }

    .home-go,
    .team-go {
      padding-bottom: 3px;
      font-size: 0.9rem;
      letter-spacing: 0.04em;
      border-bottom: 2px solid var(--zone-accent, var(--pq-green));
    }

    /* Under the sisters and their words: the tagline, and two more ways on. */
    .home-mid {
      flex: 0 0 100%;
      min-width: 0;
    }

    .home-mid-words {
      grid-template-rows: auto auto;
      row-gap: 0.9rem;
      padding: 0 1rem 2.25rem;
    }

    .home-tagline {
      margin: 0;
      font-size: clamp(1.05rem, 2.6vw, 1.3rem);
      line-height: 1.2;
    }

    .home-more {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem 1.5rem;
    }

    .home-skip,
    .home-make {
      background: none;
      border: none;
      border-bottom: 2px solid var(--sky-blue);
      padding: 0 0 2px;
      font: inherit;
      font-size: 0.9rem;
      letter-spacing: 0.04em;
      color: var(--ink);
      text-transform: lowercase;
      cursor: pointer;
      transition: border-color 0.2s ease;
    }

    .home-skip:hover,
    .home-make:hover {
      border-bottom-color: var(--pq-green);
    }

    .team-face img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
    }

    .team-card:hover .team-face {
      transform: translateY(-6px);
    }

    /* ===== THE TEAM: BACK-UP, ON A TAB OF ITS OWN ===== */
    .team-lede {
      max-width: 520px;
      margin: -1.5rem auto 3rem;
      text-align: center;
      font-size: 1.1rem;
      font-weight: 300;
      line-height: 1.7;
    }

    .team-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 3rem 2rem;
      max-width: 860px;
      margin: 0 auto 2rem;
    }

    /* the two sisters, in a row of their own above the others */
    .team-grid.team-sisters {
      max-width: 560px;
      margin-bottom: 3rem;
    }

    .team-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      background: none;
      border: none;
      padding: 0;
      font: inherit;
      color: inherit;
      text-transform: lowercase;
      cursor: pointer;
    }

    .team-face {
      width: 132px;
      height: 132px;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--zone-accent, var(--pq-green));
      transition: transform 0.3s ease;
    }

    .team-name {
      margin-top: 1.1rem;
      font-size: 1.6rem;
      font-weight: 300;
      letter-spacing: 0.02em;
      line-height: 1.1;
    }

    .team-role {
      margin-top: 0.25rem;
      font-size: 0.85rem;
      color: var(--ink-soft);
    }

    .team-helps {
      max-width: 240px;
      margin-top: 0.7rem;
      font-size: 0.98rem;
      line-height: 1.5;
    }

    .team-go {
      margin-top: 0.8rem;
    }

    /* ===== ZONE PAGES ===== */
    .zone-page {
      min-height: 100vh;
      position: relative;
      animation: fadeInZone 0.6s ease;
    }

    @keyframes fadeInZone {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .zone-hero {
      min-height: 400px;
      padding: 3.5rem 1.5rem 3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .zone-hero-content {
      position: relative;
      z-index: 1;
      text-align: center;
      color: var(--ink);
    }

    .zone-hero-avatar {
      width: 104px;
      height: 104px;
      border-radius: 50%;
      margin: 0 auto 1.4rem;
      overflow: hidden;
      box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--zone-accent, var(--pq-green));
      background: #fff;
    }

    .zone-hero-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
    }

    .zone-hero-name {
      font-size: 3rem;
      font-weight: 300;
      letter-spacing: 0.02em;
      line-height: 1.1;
      margin-bottom: 0.5rem;
      text-transform: lowercase;
    }

    .zone-hero-role {
      font-size: 0.78rem;
      font-weight: 400;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin-bottom: 1.25rem;
    }

    .zone-hero-tagline {
      font-size: 1.15rem;
      font-weight: 300;
      font-style: italic;
      max-width: 440px;
      margin: 0 auto;
      line-height: 1.55;
    }

    .zone-section {
      padding: 4rem 2rem;
      max-width: 1000px;
      margin: 0 auto;
    }

    .zone-desc {
      text-align: center;
      font-size: 1.1rem;
      font-weight: 300;
      color: var(--ink);
      line-height: 1.8;
      max-width: 580px;
      margin: 0 auto 3rem;
    }

    .zone-section-title {
      font-size: 1.8rem;
      font-weight: 300;
      letter-spacing: 0.02em;
      text-transform: lowercase;
      margin-bottom: 2.5rem;
      text-align: center;
    }

    .zone-products {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr));
      gap: 2rem;
    }

    .zone-other {
      padding: 2rem 2rem 0;
      text-align: center;
      border-top: 1px solid var(--line);
    }

    .zone-other-label {
      font-size: 0.78rem;
      color: var(--beluga);
      margin-bottom: 0.75rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }

    .zone-nav {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      padding: 1rem 2rem 3rem;
      flex-wrap: wrap;
    }

    .zone-nav-chip {
      font-size: 0.82rem;
      font-weight: 400;
      letter-spacing: 0.04em;
      text-transform: lowercase;
      padding: 8px 18px;
      border-radius: 999px;
      border: 2px solid var(--chip-accent, var(--pq-green));
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      transition: background 0.2s ease;
      font-family: 'Jost', sans-serif;
    }

    .zone-nav-chip:hover {
      background: var(--chip-accent, var(--pq-green));
    }

    @media (max-width: 768px) {
      .zone-hero {
        min-height: 320px;
      }

      .zone-hero-name {
        font-size: 2.3rem;
      }

      .zone-hero-avatar {
        width: 84px;
        height: 84px;
      }
    }

    @media (max-width: 560px) {
      .team-face {
        width: 112px;
        height: 112px;
      }

      .zone-hero {
        min-height: 280px;
        padding: 2.5rem 1rem 2.25rem;
      }

      .zone-hero-name {
        font-size: 2rem;
      }

      .zone-hero-tagline {
        font-size: 1rem;
        padding: 0 0.5rem;
      }
    }

    /* ===== TRY-ON ===== */
    .tryon-open {
      width: 100%;
      padding: 12px 30px;
      background: #fff;
      color: var(--ink);
      border: 2px solid var(--ink);
      border-radius: 999px;
      cursor: pointer;
      font-family: 'Jost', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: lowercase;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .tryon-open:hover {
      background: var(--ink);
      color: #fff;
    }

    .tryon-panel {
      background: var(--orbit-white);
      border-radius: var(--radius);
      padding: 1.25rem;
      position: relative;
    }

    .tryon-file {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .tryon-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 0.6rem;
    }

    .tryon-title {
      font-size: 0.85rem;
      font-weight: 500;
      text-transform: lowercase;
      letter-spacing: 0.05em;
    }

    .tryon-link {
      background: none;
      border: none;
      padding: 6px 0;
      font-family: 'Jost', sans-serif;
      font-size: 0.85rem;
      color: var(--ink);
      cursor: pointer;
      text-decoration: underline;
      text-decoration-color: var(--sky-blue);
      text-decoration-thickness: 2px;
      text-underline-offset: 4px;
      text-transform: lowercase;
    }

    .tryon-link:hover {
      text-decoration-color: var(--pq-green);
    }

    .tryon-link:disabled {
      color: #a8a8a8;
      text-decoration-color: #ddd;
      cursor: default;
    }

    .tryon-tip {
      font-size: 0.85rem;
      color: var(--ink-soft);
      line-height: 1.5;
      margin-bottom: 0.9rem;
    }

    .tryon-photo-row {
      display: flex;
      gap: 0.9rem;
      align-items: center;
      margin-bottom: 0.9rem;
    }

    .tryon-thumb {
      width: 56px;
      height: 84px;
      object-fit: cover;
      object-position: top;
      background: #eee;
      border-radius: 8px;
      flex: none;
    }

    .tryon-photo-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0 1rem;
    }

    .tryon-go {
      width: 100%;
      padding: 11px;
      font-size: 0.85rem;
    }

    .tryon-bar {
      height: 3px;
      background: rgba(42, 42, 42, 0.08);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 0.75rem;
      position: relative;
    }

    .tryon-bar::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: -40%;
      width: 40%;
      background: var(--pq-green);
      animation: tryon-slide 1.2s ease-in-out infinite;
    }

    @keyframes tryon-slide {
      from { left: -40%; }
      to { left: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      .tryon-bar::after {
        animation: none;
        left: 0;
        width: 100%;
        opacity: 0.5;
      }
    }

    .tryon-status {
      font-size: 0.85rem;
      color: var(--ink);
      line-height: 1.5;
    }

    .tryon-status:not(:empty) {
      margin-top: 0.75rem;
    }

    .tryon-status.tryon-error {
      color: var(--error);
    }

    .tryon-note {
      font-size: 0.76rem;
      color: var(--ink-soft);
      line-height: 1.5;
      margin-top: 0.75rem;
    }

    .tryon-view {
      position: absolute;
      left: 50%;
      bottom: 0.9rem;
      transform: translateX(-50%);
      display: flex;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid var(--line);
      border-radius: 999px;
      overflow: hidden;
      white-space: nowrap;
    }

    .tryon-view-btn {
      background: none;
      border: none;
      padding: 9px 15px;
      font-family: 'Jost', sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.04em;
      text-transform: lowercase;
      color: var(--ink-soft);
      cursor: pointer;
    }

    .tryon-view-btn.active {
      background: var(--ink);
      color: #fff;
    }

    /* ===== HER PHOTO, AND EVERY PIECE ON HER =====
       She adds her photo once. It is kept on her own device, and a look is made for every
       piece. The shop shows each piece on her. Her picture in the top bar opens "my photo":
       where she changes it or takes it away. */
    .navbar-me {
      flex: none;
      align-self: center;
      width: 30px;
      height: 30px;
      margin: -5px 0;
      padding: 0;
      border: 2px solid var(--pq-green);
      border-radius: 50%;
      overflow: hidden;
      background: var(--orbit-white);
      cursor: pointer;
    }

    .navbar-me img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
    }

    /* A phone's top bar has no room beside its four links. There her photo is reached from
       the shop, and from any piece. */
    @media (max-width: 480px) {
      .navbar-me {
        display: none;
      }
    }

    .me-band {
      max-width: 760px;
      margin: 0 auto;
      padding: 0.9rem 1.1rem;
      background: var(--orbit-white);
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem 1rem;
      font-size: 0.9rem;
      line-height: 1.45;
      text-align: left;
    }

    .me-band-thumb {
      flex: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      object-position: top;
      background: #eee;
    }

    .me-band-words {
      flex: 1 1 14rem;
      min-width: 0;
    }

    .me-band-words.bad,
    .me-sheet-says.bad {
      color: var(--error);
    }

    .me-band-fine {
      display: block;
      margin-top: 0.2rem;
      font-size: 0.76rem;
      color: var(--ink-soft);
    }

    .me-band-acts {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem 1rem;
    }

    .me-band .tryon-bar {
      flex: 1 0 100%;
      margin-top: 0;
    }

    .me-switch {
      display: inline-flex;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 999px;
      overflow: hidden;
      white-space: nowrap;
    }

    /* A card that shows the piece on her: keep her head in the picture. */
    .product-image.product-look {
      object-position: top;
    }

    .card-wait {
      position: absolute;
      left: 0.6rem;
      top: 0.6rem;
      padding: 0.3rem 0.7rem;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 0.74rem;
      letter-spacing: 0.03em;
      color: var(--ink);
    }

    .me-sheet {
      position: relative;
      width: 100%;
      max-width: 420px;
      max-height: 92vh;
      overflow-y: auto;
      background: #fff;
      border-radius: var(--radius-lg);
      box-shadow: 0 25px 50px rgba(42, 42, 42, 0.22);
      padding: 2rem 1.75rem 1.75rem;
    }

    .me-sheet-title {
      margin: 0 0 1.1rem;
      font-size: 1.5rem;
      font-weight: 300;
      letter-spacing: 0.02em;
    }

    .me-sheet-row {
      display: flex;
      gap: 1.1rem;
      align-items: flex-start;
    }

    .me-sheet-photo {
      flex: none;
      width: 96px;
      height: 144px;
      object-fit: cover;
      object-position: top;
      border-radius: 10px;
      background: #eee;
    }

    .me-sheet-says {
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .me-sheet-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0 1.1rem;
      margin-top: 0.5rem;
    }

    .me-sheet .me-add {
      margin-top: 0.9rem;
    }

    .me-sheet-fine {
      margin-top: 1.25rem;
      font-size: 0.78rem;
      color: var(--ink-soft);
      line-height: 1.5;
    }

    /* ===== THE OUTFIT A CREW MEMBER SHOWS ===== */
    .outfit-by {
      font-size: 0.78rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--beluga);
    }

    .outfit-note {
      font-size: 1.15rem;
      font-weight: 300;
      font-style: italic;
      color: var(--ink);
      line-height: 1.5;
      margin-top: 0.5rem;
    }

    .outfit-pieces {
      display: flex;
      flex-direction: column;
    }

    .outfit-piece {
      display: flex;
      align-items: baseline;
      gap: 1rem;
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--line);
    }

    .outfit-piece-name {
      font-size: 1.05rem;
      text-transform: lowercase;
      letter-spacing: 0.02em;
    }

    .outfit-piece-price {
      margin-left: auto;
      font-size: 0.9rem;
      color: var(--ink-soft);
    }

    .outfit-total {
      display: flex;
      justify-content: space-between;
      padding-top: 0.75rem;
      font-size: 0.9rem;
      font-weight: 500;
      text-transform: lowercase;
    }

    .outfit-photos {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 1fr;
      gap: 1px;
      height: 100%;
      min-height: 400px;
    }

    .outfit-photos img {
      width: 100%;
      height: 100%;
      min-height: 0;
      object-fit: cover;
      object-position: top;
    }

    @media (max-width: 768px) {
      .modal-image.tryon-look {
        max-height: 70vh;
      }

      .outfit-photos {
        min-height: 300px;
        height: 50vh;
      }
    }

    /* On a wide screen the details scroll on their own, so the picture stays in view. */
    @media (min-width: 769px) {
      .modal-details {
        max-height: 92vh;
        overflow-y: auto;
      }
    }

    /* ===== YOUR GUIDE: THE CHAT =====
       A crew member comes along as her guide. On a wide screen the chat is a rail down
       the right side. On a narrow one it is a bar at the bottom that opens into a sheet. */
    :root {
      --guide-w: 384px;
      --guide-bar: 64px;
      --nav-h: 76px;
      --kb: 0px;   /* how much an on-screen keyboard covers, set by the page */
    }

    .guide {
      position: fixed;
      right: 0;
      bottom: var(--kb);
      background: #fff;
      display: flex;
      flex-direction: column;
      --guide-accent: var(--pq-green);
      --guide-tint: #e9f6e8;
    }

    .guide-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .guide-head,
    .guide-bar {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.8rem 1rem;
      text-align: left;
    }

    .guide-head {
      border-bottom: 1px solid var(--line);
    }

    /* Narrow screens: the bar, and beside it what she needs while the chat is folded. */
    .guide-top {
      display: flex;
      align-items: center;
      min-height: var(--guide-bar);
      border-bottom: 1px solid transparent;
    }

    .guide-bar {
      flex: 1;
      min-width: 0;
      background: none;
      border: none;
      font: inherit;
      color: inherit;
      text-transform: lowercase;
      cursor: pointer;
    }

    .guide-acts {
      flex: none;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding-right: 0.9rem;
    }

    .guide-close {
      flex: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink-soft);
      font-size: 1.15rem;
      font-weight: 300;
      line-height: 1;
      cursor: pointer;
    }

    .guide-close:hover {
      border-color: var(--ink);
      color: var(--ink);
    }

    /* Narrow screens, chat folded: the guide's last line above the bar, and the pieces in it. */
    .guide-peek {
      display: none;
    }

    .guide-peek-main {
      flex: 1;
      min-width: 0;
    }

    .guide-peek-words {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
      overflow: hidden;
      max-width: 100%;
      padding: 0.5rem 0.85rem;
      background: var(--guide-tint);
      border: none;
      border-radius: 16px;
      border-bottom-left-radius: 6px;
      font: inherit;
      font-size: 0.92rem;
      line-height: 1.4;
      color: inherit;
      text-align: left;
      text-transform: lowercase;
      cursor: pointer;
    }

    .guide-peek-pieces {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.5rem;
      overflow-x: auto;
    }

    .guide-peek-piece {
      flex: none;
      display: flex;
      align-items: center;
      gap: 0.55rem;
      max-width: 200px;
      padding: 4px 12px 4px 4px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      font: inherit;
      font-size: 0.82rem;
      line-height: 1.25;
      color: var(--ink);
      text-align: left;
      text-transform: lowercase;
      cursor: pointer;
    }

    .guide-peek-piece img {
      flex: none;
      width: 40px;
      height: 52px;
      border-radius: 8px;
      object-fit: cover;
      object-position: top 20%;
      background: var(--orbit-white);
    }

    .guide-face {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      overflow: hidden;
      flex: none;
      box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--guide-accent);
      margin: 4px;
    }

    .guide-face img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
    }

    .guide-face .crew-initial {
      font-size: 1.1rem;
    }

    .guide-who {
      flex: 1;
      min-width: 0;
    }

    .guide-name {
      font-size: 1.05rem;
      font-weight: 400;
      letter-spacing: 0.02em;
      line-height: 1.2;
    }

    .guide-state {
      font-size: 0.8rem;
      color: var(--ink-soft);
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .guide-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--guide-accent);
      margin-right: 0.4rem;
      animation: pulse-dot 1.5s ease-in-out infinite;
    }

    .guide-chevron {
      flex: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      color: var(--ink-soft);
    }

    .guide-thread {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    /* each thing in the thread keeps its own height: the thread scrolls, it does not squeeze */
    .guide-thread > * {
      flex-shrink: 0;
    }

    .guide-hello {
      margin: auto 0;
      text-align: center;
      padding: 1rem 0.5rem;
    }

    .guide-hello-line {
      font-size: 1.25rem;
      font-weight: 300;
      line-height: 1.4;
      margin-bottom: 0.4rem;
    }

    .guide-hello-sub {
      font-size: 0.9rem;
      color: var(--ink-soft);
      line-height: 1.5;
      margin-bottom: 1.25rem;
    }

    .guide-chips {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    .guide-chip {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 16px;
      font: inherit;
      font-size: 0.88rem;
      color: var(--ink);
      text-transform: lowercase;
      cursor: pointer;
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .guide-chip:hover:not(:disabled) {
      border-color: var(--guide-accent);
      background: var(--guide-tint);
    }

    .guide-chip:disabled {
      color: #a8a8a8;
      cursor: default;
    }

    .guide-say {
      max-width: 86%;
      padding: 0.6rem 0.9rem;
      border-radius: 16px;
      font-size: 0.95rem;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .guide-say.crew {
      align-self: flex-start;
      background: var(--guide-tint);
      border-bottom-left-radius: 6px;
    }

    .guide-say.me {
      align-self: flex-end;
      background: var(--orbit-white);
      border-bottom-right-radius: 6px;
    }

    .guide-aside {
      align-self: center;
      font-size: 0.78rem;
      color: var(--ink-soft);
      text-align: center;
      padding: 0.2rem 0.5rem;
    }

    .guide-pick {
      align-self: stretch;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: #fff;
      overflow: hidden;
    }

    .guide-pick-by {
      padding: 0.6rem 0.9rem 0;
      font-size: 0.72rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--beluga);
    }

    .guide-pick-note {
      padding: 0.15rem 0.9rem 0;
      font-size: 1rem;
      font-weight: 300;
      font-style: italic;
      line-height: 1.4;
    }

    .guide-piece {
      display: flex;
      gap: 0.8rem;
      padding: 0.8rem 0.9rem;
    }

    .guide-piece + .guide-piece {
      border-top: 1px solid var(--line);
    }

    .guide-piece-photo {
      flex: none;
      width: 84px;
      height: 112px;
      padding: 0;
      border: none;
      border-radius: 10px;
      overflow: hidden;
      background: var(--orbit-white);
      cursor: pointer;
    }

    .guide-piece-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top 20%;
    }

    .guide-piece-photo canvas {
      display: block;
      width: 100%;
      height: 100%;
      padding: 6px;
      box-sizing: border-box;
      object-fit: contain;
    }

    .guide-piece-main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }

    .guide-piece-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .guide-piece-name {
      font-size: 0.98rem;
      letter-spacing: 0.02em;
    }

    .guide-piece-price {
      font-size: 0.9rem;
      color: var(--ink-soft);
    }

    .guide-piece-colors {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .guide-color {
      width: 22px;
      height: 22px;
      padding: 0;
      border-radius: 50%;
      border: 1px solid rgba(42, 42, 42, 0.18);
      cursor: pointer;
    }

    .guide-color.selected {
      box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--ink);
    }

    .guide-color-name {
      font-size: 0.78rem;
      color: var(--ink-soft);
      margin-left: 0.2rem;
    }

    .guide-piece-sizes {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .guide-piece-sizes .size-option {
      min-width: 32px;
      padding: 5px 4px;
      font-size: 0.7rem;
      letter-spacing: 0.02em;
    }

    .guide-piece-actions {
      display: flex;
      align-items: center;
      gap: 0.9rem;
    }

    .guide-add {
      padding: 8px 16px;
      font-size: 0.82rem;
    }

    .guide-live {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.55rem 1rem;
      background: var(--guide-tint);
      font-size: 0.88rem;
    }

    .guide-live-words {
      flex: 1;
      min-width: 0;
    }

    .guide-small {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 5px 13px;
      font: inherit;
      font-size: 0.8rem;
      color: var(--ink);
      text-transform: lowercase;
