<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Piper & Quinn — Fashion by Sisters</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/@elevenlabs/convai-widget-embed" async type="text/javascript"></script>
  <style>
    * {
      font-family: 'Jost', 'system-ui', 'sans-serif';
    }

    body {
      margin: 0;
      padding: 0;
      background: white;
      color: #1a1a1a;
    }

    .hero-section {
      width: 100vw;
      height: 70vh;
      background-image: url('img/active-hd.jpg');
      background-size: cover;
      background-position: center;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
    }

    .hero-text {
      font-weight: 300;
      font-size: 3rem;
      text-align: center;
      letter-spacing: 2px;
      line-height: 1.2;
      margin-bottom: 2rem;
    }

    .tagline {
      font-size: 1rem;
      font-weight: 300;
      letter-spacing: 1px;
      margin-bottom: 2rem;
    }

    .cta-button {
      background: white;
      color: black;
      padding: 12px 32px;
      font-size: 0.875rem;
      font-weight: 400;
      letter-spacing: 1px;
      text-transform: lowercase;
      cursor: pointer;
      transition: opacity 0.3s ease;
      border: 1px solid white;
    }

    .cta-button:hover {
      opacity: 0.8;
    }

    .image-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(3, 250px);
      gap: 1px;
      background: white;
      padding: 0;
      margin: 4rem 0;
    }

    .grid-item {
      background-size: cover;
      background-position: center;
      overflow: hidden;
    }

    .grid-item:nth-child(1) {
      grid-column: span 2;
      grid-row: span 2;
    }

    .grid-item:nth-child(2) {
      grid-column: span 1;
      grid-row: span 2;
    }

    .grid-item:nth-child(3) {
      grid-column: span 1;
    }

    .grid-item:nth-child(4) {
      grid-column: span 2;
    }

    .grid-item:nth-child(5) {
      grid-column: span 1;
      grid-row: span 2;
    }

    .sisters-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
    }

    .sisters-grid img {
      width: 100%;
      height: 700px;
      object-fit: cover;
      object-position: top;
    }

    @media (max-width: 768px) {
      .hero-section {
        height: 85vh;
      }

      .hero-text {
        font-size: 2rem !important;
      }

      .sisters-grid {
        grid-template-columns: 1fr;
      }

      .sisters-grid img {
        height: 500px;
      }

      .sisters-grid .sister-caption div:first-child {
        font-size: 0.7rem;
      }

      .sisters-grid .sister-caption div:last-child {
        font-size: 1.2rem;
      }

      .category-nav {
        gap: 1.5rem;
      }

      .cart-item {
        flex-direction: column;
        align-items: flex-start;
        gap: 1rem;
      }

      .quantity-control {
        width: 100%;
        justify-content: flex-start;
      }
    }

    @media (max-width: 480px) {
      .hero-text {
        font-size: 1.5rem !important;
      }

      .navbar-content {
        padding: 0.75rem 1rem;
      }

      .navbar-brand {
        font-size: 0.95rem;
        letter-spacing: 1px;
      }

      .navbar-links {
        gap: 0.75rem;
        font-size: 0.7rem;
      }

      .sisters-grid img {
        height: 350px;
      }

      .category-nav {
        gap: 1rem;
        font-size: 0.8rem;
      }

      .main-content {
        padding: 0 1rem;
      }

      .footer-content {
        grid-template-columns: repeat(2, 1fr);
      }

      .color-swatch {
        width: 48px;
        height: 48px;
      }

      .pattern-thumb {
        width: 64px;
        height: 64px;
      }

      .garment-preview {
        width: 150px !important;
        height: 225px !important;
      }

      .studio-grid {
        grid-template-columns: 1fr !important;
        gap: 2rem !important;
      }
    }

    .story-section {
      max-width: 700px;
      margin: 6rem auto;
      padding: 0 2rem;
      text-align: center;
    }

    .story-title {
      font-size: 2rem;
      font-weight: 300;
      letter-spacing: 1px;
      margin-bottom: 2rem;
      text-transform: lowercase;
    }

    .story-text {
      font-size: 1rem;
      font-weight: 400;
      line-height: 1.8;
      color: #333;
    }

    .product-card {
      position: relative;
      overflow: hidden;
      background: #f5f5f0;
      cursor: pointer;
    }

    .product-card-image-wrapper {
      aspect-ratio: 3/4;
      overflow: hidden;
      background: #f5f5f0;
    }

    .product-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top 20%;
      transition: opacity 0.3s ease;
    }

    .product-card:hover .product-image {
      opacity: 0.85;
    }

    .product-info {
      padding: 0.75rem 0.25rem;
      text-align: left;
    }

    .product-name {
      font-size: 0.9rem;
      font-weight: 500;
      margin-bottom: 0.25rem;
      text-transform: lowercase;
      letter-spacing: 0.3px;
    }

    .product-price {
      font-size: 0.85rem;
      font-weight: 400;
      color: #666;
    }

    .filter-link {
      text-transform: lowercase;
      font-size: 0.875rem;
      font-weight: 400;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.3s ease;
      padding-bottom: 4px;
    }

    .filter-link.active {
      border-bottom: 1px solid black;
    }

    .filter-link:hover {
      opacity: 0.6;
    }

    .color-swatch {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      border: 2px solid transparent;
    }

    .color-swatch:hover {
      transform: scale(1.1);
    }

    .color-swatch.selected {
      border-color: black;
    }

    .pattern-thumb {
      width: 80px;
      height: 80px;
      cursor: pointer;
      opacity: 0.6;
      transition: opacity 0.2s ease;
      border: 2px solid transparent;
    }

    .pattern-thumb:hover,
    .pattern-thumb.selected {
      opacity: 1;
      border-color: black;
    }

    .garment-preview {
      width: 200px;
      height: 300px;
      margin: 2rem auto;
      position: relative;
    }

    .fade-in {
      animation: fadeIn 0.4s ease-in;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    .category-nav {
      display: flex;
      gap: 3rem;
      justify-content: center;
      margin: 2rem 0;
      flex-wrap: wrap;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem;
      border-bottom: 1px solid #e8e8e3;
    }

    .cart-item-details {
      flex: 1;
    }

    .cart-item-name {
      font-weight: 500;
      margin-bottom: 0.5rem;
    }

    .cart-item-meta {
      font-size: 0.875rem;
      color: #666;
    }

    .quantity-control {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .qty-button {
      width: 32px;
      height: 32px;
      border: 1px solid #ccc;
      background: white;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .qty-button:hover {
      background: #f5f5f0;
    }

    .navbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: white;
      border-bottom: 1px solid #efefeb;
    }

    .navbar-content {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1.5rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .navbar-brand {
      font-size: 1.25rem;
      font-weight: 300;
      letter-spacing: 2px;
      text-transform: lowercase;
      cursor: pointer;
    }

    .navbar-links {
      display: flex;
      gap: 2rem;
      text-transform: lowercase;
      font-weight: 400;
      font-size: 0.875rem;
      letter-spacing: 0.5px;
    }

    .navbar-link {
      cursor: pointer;
      transition: opacity 0.3s ease;
    }

    .navbar-link:hover {
      opacity: 0.6;
    }

    .footer {
      background: #1a1a1a;
      color: white;
      padding: 4rem 2rem;
      margin-top: 6rem;
    }

    .footer-content {
      max-width: 1400px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 3rem;
    }

    .footer-section h3 {
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: lowercase;
      margin-bottom: 1rem;
    }

    .footer-link {
      font-size: 0.875rem;
      line-height: 1.8;
      cursor: pointer;
      transition: opacity 0.3s ease;
    }

    .footer-link:hover {
      opacity: 0.7;
    }

    .main-content {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 2rem;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 1rem;
    }

    .modal-content {
      background: white;
      max-width: 960px;
      width: 100%;
      max-height: 92vh;
      overflow-y: auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      position: relative;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
    }

    .modal-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      z-index: 10;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      min-height: 400px;
      background: #f5f3f0;
    }

    .modal-details {
      padding: 2.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .modal-product-name {
      font-size: 1.5rem;
      font-weight: 400;
      text-transform: lowercase;
      letter-spacing: 0.5px;
    }

    .modal-product-price {
      font-size: 1.1rem;
      color: #666;
    }

    .modal-product-desc {
      font-size: 0.9rem;
      color: #555;
      line-height: 1.6;
    }

    .size-option {
      padding: 8px 16px;
      border: 1px solid #ddd;
      background: white;
      cursor: pointer;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.2s ease;
    }

    .size-option:hover {
      border-color: #999;
    }

    .size-option.selected {
      background: black;
      color: white;
      border-color: black;
    }

    .add-to-cart-btn {
      padding: 14px 32px;
      background: black;
      color: white;
      border: none;
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: lowercase;
      transition: opacity 0.2s ease;
      margin-top: auto;
    }

    .add-to-cart-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .add-to-cart-btn:not(:disabled):hover {
      opacity: 0.8;
    }

    .size-calc-toggle {
      font-size: 0.8rem;
      color: #666;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 2px;
      transition: color 0.2s ease;
      display: inline-block;
      margin-top: 0.25rem;
    }

    .size-calc-toggle:hover {
      color: #333;
    }

    .size-calc-panel {
      background: #fafaf8;
      border: 1px solid #e8e8e3;
      padding: 1.25rem;
      margin-top: 0.75rem;
    }

    .size-calc-label {
      font-size: 0.75rem;
      font-weight: 500;
      text-transform: lowercase;
      letter-spacing: 0.5px;
      color: #555;
      margin-bottom: 0.4rem;
    }

    .size-calc-input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ddd;
      font-size: 0.85rem;
      font-family: 'Jost', sans-serif;
      background: white;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .size-calc-input:focus {
      border-color: #999;
    }

    .size-calc-result {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      background: black;
      color: white;
      font-size: 0.85rem;
      text-align: center;
      letter-spacing: 0.5px;
    }

    .size-calc-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }

    .size-calc-unit-toggle {
      display: flex;
      gap: 0;
      margin-bottom: 1rem;
    }

    .size-calc-unit-btn {
      flex: 1;
      padding: 6px 12px;
      font-size: 0.75rem;
      border: 1px solid #ddd;
      background: white;
      cursor: pointer;
      font-family: 'Jost', sans-serif;
      text-transform: lowercase;
      letter-spacing: 0.5px;
      transition: all 0.2s ease;
    }

    .size-calc-unit-btn.active {
      background: black;
      color: white;
      border-color: black;
    }

    @media (max-width: 768px) {
      .modal-content {
        grid-template-columns: 1fr;
      }

      .modal-image {
        min-height: 300px;
        max-height: 50vh;
      }

      .modal-details {
        padding: 1.5rem;
      }
    }

    .crew-section {
      background: #fafaf5;
      padding: 5rem 2rem;
      text-align: center;
    }

    .crew-title {
      font-size: 2rem;
      font-weight: 300;
      letter-spacing: 1px;
      text-transform: lowercase;
      margin-bottom: 0.75rem;
    }

    .crew-subtitle {
      font-size: 0.95rem;
      color: #666;
      font-weight: 400;
      margin-bottom: 3rem;
      letter-spacing: 0.3px;
    }

    .crew-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 1.5rem;
      max-width: 900px;
      margin: 0 auto;
    }

    .crew-card {
      background: white;
      border-radius: 16px;
      padding: 1.75rem 1rem 1.25rem;
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      border: 2px solid transparent;
    }

    .crew-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }

    .crew-card.active {
      border-color: var(--card-accent, #6DC067);
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
    }

    .crew-avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      margin: 0 auto 1rem;
      overflow: hidden;
      border: 3px solid #f0f0e8;
    }

    .crew-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
    }

    .crew-avatar-initials {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: 600;
      color: white;
    }

    .crew-name {
      font-size: 0.95rem;
      font-weight: 600;
      text-transform: lowercase;
      letter-spacing: 0.3px;
      margin-bottom: 0.2rem;
    }

    .crew-role {
      font-size: 0.7rem;
      color: #888;
      text-transform: lowercase;
      letter-spacing: 0.5px;
      margin-bottom: 0.75rem;
      line-height: 1.3;
    }

    .crew-talk-btn {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-transform: lowercase;
      padding: 6px 14px;
      border-radius: 20px;
      border: none;
      cursor: pointer;
      transition: opacity 0.2s ease;
      font-family: 'Jost', sans-serif;
    }

    .crew-talk-btn:hover {
      opacity: 0.85;
    }

    .crew-chat-hint {
      margin-top: 2.5rem;
      font-size: 0.85rem;
      color: #999;
      font-weight: 400;
      letter-spacing: 0.3px;
    }

    .crew-chat-active {
      margin-top: 2rem;
      padding: 1.25rem 2rem;
      background: white;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }

    .crew-chat-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      animation: pulse-dot 1.5s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    @media (max-width: 768px) {
      .crew-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 1rem;
      }

      .crew-avatar {
        width: 56px;
        height: 56px;
      }

      .crew-name {
        font-size: 0.85rem;
      }

      .crew-role {
        font-size: 0.65rem;
      }
    }

    @media (max-width: 480px) {
      .crew-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .crew-section {
        padding: 3rem 1rem;
      }
    }

    /* ===== CHARACTER SELECT SCREEN ===== */
    .char-select {
      min-height: 100vh;
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }

    .char-select::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(ellipse at 50% 40%, rgba(109,192,103,0.06) 0%, transparent 60%);
      pointer-events: none;
    }

    .char-select-label {
      font-size: 0.8rem;
      font-weight: 300;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      margin-bottom: 0.5rem;
    }

    .char-select-brand {
      font-size: 2.75rem;
      font-weight: 300;
      letter-spacing: 3px;
      color: white;
      margin-bottom: 0.5rem;
      text-transform: lowercase;
    }

    .char-select-subtitle {
      font-size: 1rem;
      font-weight: 300;
      color: rgba(255,255,255,0.35);
      margin-bottom: 4rem;
      letter-spacing: 1px;
    }

    .char-select-grid {
      display: flex;
      gap: 1.25rem;
      max-width: 1100px;
      width: 100%;
      justify-content: center;
    }

    .char-card {
      flex: 1;
      max-width: 190px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 20px;
      padding: 2rem 1.25rem 1.5rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }

    .char-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 0%, var(--zone-glow, rgba(109,192,103,0.12)) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .char-card:hover {
      transform: translateY(-8px) scale(1.03);
      border-color: var(--zone-accent, rgba(255,255,255,0.2));
      box-shadow: 0 20px 60px rgba(0,0,0,0.4), 0 0 30px var(--zone-glow, rgba(109,192,103,0.08));
    }

    .char-card:hover::before {
      opacity: 1;
    }

    .char-card-avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      margin: 0 auto 1.25rem;
      overflow: hidden;
      border: 2px solid rgba(255,255,255,0.12);
      position: relative;
      z-index: 1;
      transition: border-color 0.4s ease;
    }

    .char-card:hover .char-card-avatar {
      border-color: var(--zone-accent, rgba(255,255,255,0.3));
    }

    .char-card-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
    }

    .char-card-initials {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 600;
      color: white;
    }

    .char-card-name {
      font-size: 1.1rem;
      font-weight: 500;
      color: white;
      letter-spacing: 0.5px;
      margin-bottom: 0.25rem;
      position: relative;
      z-index: 1;
      text-transform: lowercase;
    }

    .char-card-role {
      font-size: 0.65rem;
      color: rgba(255,255,255,0.4);
      text-transform: lowercase;
      letter-spacing: 0.5px;
      margin-bottom: 1.25rem;
      line-height: 1.4;
      position: relative;
      z-index: 1;
