  <script>
    // Safari on a Mac can play a crew member's voice with no sound. The voice library gets
    // sound ready only on an iPhone or iPad, which it tells by touch. It looks as it loads,
    // and again at each tap. crewSound(true) has Safari on a Mac take that same step.
    // crewSound(false) undoes it. The step is on until the library has loaded, then only
    // while a crew member is with her as her guide. ElevenLabs was sent a fix
    // (github.com/elevenlabs/packages/pull/1025). It is not in 1.27.0. When a version has
    // it, take this script out and move the library on.
    (function () {
      var macSafari = false;
      try { macSafari = navigator.vendor === 'Apple Computer, Inc.' && !('ontouchend' in document); } catch (e) {}
      var loaded = false, guide = false;
      var set = function (on) {
        if (!macSafari) return;
        try { if (on) document.ontouchend = null; else delete document.ontouchend; } catch (e) {}
      };
      window.crewSound = function (on) { guide = !!on; set(guide || !loaded); };
      window.crewVoiceLoaded = function () { loaded = true; set(guide); };
      set(true);
    })();
  </script>

  <style>
    /* ===== THE BRAND =====
       From the piper & quinn brand style guide, version 1.0 (october 2026).
       Colors are the guide's hex values. Type is Jost: light for headlines, regular for body.
       All copy is lowercase. The wordmark is green with a sky-blue ampersand. */
    :root {
      --pq-green: #6DC067;
      --sky-blue: #ACD9F4;
      --green-grass: #B1D355;
      --orange-tee: #FBB040;
      --coral: #E8685A;
      --midnight: #1B2A4A;
      --hot-pink: #E84B8A;
      --lavender: #C4A7D7;
      --ocean: #2B7A9E;
      --sunshine: #F7D559;
      --orbit-white: #F8F6F1;
      --city-khaki: #C8B898;
      --wild-black: #2A2A2A;
      --beluga: #808080;

      --ink: var(--wild-black);
      --ink-soft: #5e5e5e;               /* wild black, lightened: small words that must be read */
      --line: rgba(42, 42, 42, 0.1);     /* wild black, as a hairline */
      --line-soft: rgba(42, 42, 42, 0.06);
      --green-press: #5fb259;            /* p&q green, a step darker: a pressed or hovered button */
      --error: #b3261e;
      --radius: 12px;
      --radius-lg: 16px;
      --shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      --shadow-up: 0 12px 32px rgba(42, 42, 42, 0.12);
    }

    * {
      font-family: 'Jost', 'system-ui', 'sans-serif';
    }

    body {
      margin: 0;
      padding: 0;
      background: #fff;
      color: var(--ink);
      font-weight: 400;
      text-transform: lowercase;
      -webkit-font-smoothing: antialiased;
    }

    /* What she types shows as she typed it. */
    input, textarea, select {
      text-transform: none;
    }

    :focus-visible {
      outline: 3px solid var(--sky-blue);
      outline-offset: 2px;
    }

    /* The wordmark: lowercase jost light, green, the ampersand in sky blue. */
    .wordmark {
      font-weight: 300;
      letter-spacing: 0.02em;
      text-transform: lowercase;
      color: var(--pq-green);
      white-space: nowrap;
    }

    .wordmark .amp {
      color: var(--sky-blue);
    }

    /* The tagline: p&q green, jost light italic, lowercase. */
    .tagline {
      font-weight: 300;
      font-style: italic;
      color: var(--pq-green);
      text-transform: lowercase;
    }

    /* The guide's rule: green, sky blue, grass, orange. */
    .color-rule {
      height: 3px;
      background: linear-gradient(90deg, var(--pq-green), var(--sky-blue), var(--green-grass), var(--orange-tee));
    }

    /* Buttons. The main one is p&q green with wild-black words. */
    .btn-primary,
    .add-to-cart-btn,
    .tryon-go {
      display: inline-block;
      padding: 13px 30px;
      background: var(--pq-green);
      color: var(--ink);
      border: none;
      border-radius: 999px;
      cursor: pointer;
      font-family: 'Jost', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: lowercase;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .btn-primary:not(:disabled):hover,
    .add-to-cart-btn:not(:disabled):hover,
    .tryon-go:not(:disabled):hover {
      background: var(--green-press);
    }

    .btn-primary:disabled,
    .add-to-cart-btn:disabled,
    .tryon-go:disabled {
      background: #e6e3dc;
      color: #8a8a8a;
      cursor: not-allowed;
    }

    .btn-note {
      margin-top: 0.75rem;
      font-size: 0.85rem;
      color: var(--ink-soft);
      min-height: 1.3em;
    }

    .page-title {
      font-size: 2.2rem;
      font-weight: 300;
      text-align: center;
      margin: 3rem 0;
      letter-spacing: 0.02em;
      color: var(--ink);
    }

    .studio-heading {
      font-size: 1.1rem;
      font-weight: 400;
      color: var(--pq-green);
      text-transform: lowercase;
      letter-spacing: 0.02em;
      margin-bottom: 1.5rem;
    }

    .studio-caption {
      font-size: 0.9rem;
      color: var(--ink-soft);
      text-align: center;
    }

    .cart-empty {
      text-align: center;
      padding: 3rem;
    }

    .cart-empty p:first-child {
      font-size: 1.1rem;
      font-weight: 300;
      margin-bottom: 0.5rem;
    }

    .cart-empty p:last-child {
      font-size: 0.9rem;
      color: var(--ink-soft);
    }

    .cart-totals {
      max-width: 700px;
      margin: 2rem auto;
      padding: 2rem 0.5rem;
      border-bottom: 1px solid var(--line);
    }

    .cart-totals > div {
      display: flex;
      justify-content: space-between;
      margin-bottom: 1rem;
      font-size: 1rem;
    }

    .cart-totals > div.soft {
      font-size: 0.875rem;
      color: var(--ink-soft);
    }

    .cart-totals > div.sum {
      font-size: 1.15rem;
      font-weight: 500;
      margin-bottom: 0;
    }

    .label {
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: lowercase;
      margin-bottom: 0.75rem;
    }

    .product-card {
      position: relative;
      overflow: hidden;
      background: #fff;
      border-radius: var(--radius);
      cursor: pointer;
    }

    .product-card-image-wrapper {

    .product-image {

    .product-price {

      font-weight: 400;
      color: var(--ink-soft);
    }

    .filter-link {

      font-size: 0.9rem;
      font-weight: 400;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: border-color 0.2s ease;

      border-bottom: 2px solid transparent;
    }

    .filter-link.active {

    .filter-link:hover {
      border-bottom-color: var(--sky-blue);

    }

    .color-swatch {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      border: 1px solid var(--line);
    }

    .color-swatch:hover {
      transform: scale(1.08);
    }

    .color-swatch.selected {
      box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--ink);
    }

    .pattern-thumb {
      width: 80px;
      height: 80px;
      cursor: pointer;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      transition: box-shadow 0.2s ease;
    }

    .pattern-thumb.selected {
      box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--ink);
    }

    .garment-preview {
      width: 200px;
      height: 300px;
      margin: 2rem auto;
      position: relative;
    }

    .fade-in {
      animation: fadeIn 0.4s ease-in;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    .category-nav {
      display: flex;
      gap: 3rem;
      justify-content: center;
      margin: 2rem 0;
      flex-wrap: wrap;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 0.5rem;
      border-bottom: 1px solid var(--line);
    }

    .cart-item-details {
      flex: 1;
    }

    .cart-item-name {
      font-weight: 400;
      font-size: 1.05rem;
      margin-bottom: 0.4rem;
    }

    .cart-item-meta {
      font-size: 0.875rem;
      color: var(--ink-soft);
    }

    .quantity-control {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .qty-button {
      width: 34px;
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
      font-weight: 400;

    }

    .qty-button:hover {

    .navbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255, 255, 255, 0.96);

    .navbar-content {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1.1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .navbar-brand {

      cursor: pointer;
    }

    .navbar-links {
      display: flex;
      gap: 2rem;
      text-transform: lowercase;
      font-weight: 400;
      font-size: 0.9rem;
      letter-spacing: 0.04em;
    }

    .navbar-link {
      cursor: pointer;
      padding-bottom: 2px;
      border-bottom: 2px solid transparent;
      transition: border-color 0.2s ease;
    }

    .navbar-link:hover {

    .navbar-link.active {

    .footer {
      background: var(--orbit-white);

    }

    .footer-content {
      max-width: 1400px;
      margin: 0 auto;
      padding: 3.5rem 2rem 3rem;
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 2rem;
    }

    .footer-brand {
      font-size: 2rem;
    }

    .footer-tagline {
      font-size: 1.15rem;
      margin-top: 0.15rem;
    }

    .footer-place {
      font-size: 0.85rem;
      color: var(--ink-soft);
      margin-top: 0.9rem;
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1.75rem;
      font-size: 0.9rem;
      letter-spacing: 0.04em;
    }

    .footer-link {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 0 0 2px;
      font: inherit;
      color: inherit;
      letter-spacing: inherit;
      text-transform: lowercase;

    .footer-link:hover {

    .footer-legal {

      border-top: 1px solid var(--line);

    }

    .main-content {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 2rem;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(42, 42, 42, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 1rem;

    .modal-content {
      background: #fff;
      max-width: 960px;
      width: 100%;
      max-height: 92vh;
      overflow-y: auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      position: relative;
      border-radius: var(--radius-lg);
      box-shadow: 0 25px 50px rgba(42, 42, 42, 0.22);

    .modal-close {

      z-index: 10;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink);
      transition: border-color 0.2s ease;

    .modal-close:hover {

    .modal-pane {

    .modal-image {

      background: transparent;

      font-family: 'Jost', sans-serif;

      transition: background 0.2s ease, color 0.2s ease;

    /* ===== HOME: CHOOSE YOUR GUIDE ===== */
    .char-select {
      min-height: 100vh;
      background: linear-gradient(135deg, #f0faf0 0%, #e8f4fc 50%, #f5f9e8 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
      position: relative;
      overflow: hidden;
    }

    .char-select::before {
      content: '';
      position: absolute;
      top: -20%;
      right: -10%;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(109, 192, 103, 0.08) 0%, transparent 70%);
      pointer-events: none;
    }

    .char-select::after {
      content: '';
      position: absolute;
      bottom: -15%;
      left: -5%;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(172, 217, 244, 0.1) 0%, transparent 70%);
      pointer-events: none;
    }

    .char-select > * {
      position: relative;
      z-index: 1;
    }

    .char-select-brand {
      font-size: 4.25rem;
      line-height: 1.1;
    }

    .char-select-tagline {
      font-size: 1.6rem;
      margin-top: 0.25rem;
    }

    .char-select-subtitle {
      font-size: 0.8rem;
      font-weight: 400;
      color: var(--beluga);
      margin: 3.5rem 0 1.5rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }

    .char-select-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 1.1rem;
      max-width: 1040px;
      width: 100%;
      justify-content: center;
    }

    .char-card {
      flex: 0 0 184px;
      background: #fff;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      padding: 1.75rem 1rem 1.4rem;
      text-align: center;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .char-card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-up);
    }

    .char-card-avatar {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      margin: 0 auto 1.1rem;
      overflow: hidden;
      box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--zone-accent, var(--pq-green));
    }

    .char-card-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
    }

    .char-card-initials {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      font-weight: 300;
      color: var(--ink);
      text-transform: lowercase;
    }

    .char-card-name {
      font-size: 1.25rem;
      font-weight: 400;
      color: var(--ink);
      letter-spacing: 0.02em;
      margin-bottom: 0.2rem;
      text-transform: lowercase;
    }

    .char-card-role {
      font-size: 0.78rem;
      color: var(--beluga);
      text-transform: lowercase;
      letter-spacing: 0.03em;
      margin-bottom: 1.1rem;
      line-height: 1.35;
      min-height: 2.1em;
    }

    .char-card-enter {
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: lowercase;
      padding: 8px 18px;
      border-radius: 999px;
      border: none;
      background: var(--zone-accent, var(--pq-green));
      color: var(--ink);
      cursor: pointer;
      font-family: 'Jost', sans-serif;
    }

    .char-select-skip {
      margin-top: 2.75rem;
      font-size: 0.9rem;
      color: var(--ink);
      cursor: pointer;
      letter-spacing: 0.04em;
      padding-bottom: 2px;
      border-bottom: 2px solid var(--sky-blue);
      transition: border-color 0.2s ease;
    }

    .char-select-skip:hover {
      border-bottom-color: var(--pq-green);
    }

    /* ===== ZONE PAGES ===== */
    .zone-page {
      min-height: 100vh;
      position: relative;
      animation: fadeInZone 0.6s ease;
    }

    @keyframes fadeInZone {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .zone-hero {
      min-height: 400px;
      padding: 4.5rem 1.5rem 3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .zone-hero-content {
      position: relative;
      z-index: 1;
      text-align: center;
      color: var(--ink);
    }

    .zone-hero-avatar {
      width: 104px;
      height: 104px;
      border-radius: 50%;
      margin: 0 auto 1.4rem;
      overflow: hidden;
      box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--zone-accent, var(--pq-green));
      background: #fff;
    }

    .zone-hero-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
    }

    .zone-hero-name {
      font-size: 3rem;
      font-weight: 300;
      letter-spacing: 0.02em;
      line-height: 1.1;
      margin-bottom: 0.5rem;
      text-transform: lowercase;
    }

    .zone-hero-role {
      font-size: 0.78rem;
      font-weight: 400;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin-bottom: 1.25rem;
    }

    .zone-hero-tagline {
      font-size: 1.15rem;
      font-weight: 300;
      font-style: italic;
      max-width: 440px;
      margin: 0 auto;
      line-height: 1.55;
    }

    .zone-section {
      padding: 4rem 2rem;
      max-width: 1000px;
      margin: 0 auto;
    }

    .zone-desc {
      text-align: center;
      font-size: 1.1rem;
      font-weight: 300;
      color: var(--ink);
      line-height: 1.8;
      max-width: 580px;
      margin: 0 auto 3rem;
    }

    .zone-section-title {
      font-size: 1.8rem;
      font-weight: 300;
      letter-spacing: 0.02em;
      text-transform: lowercase;
      margin-bottom: 2.5rem;
      text-align: center;
    }

    .zone-products {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr));
      gap: 2rem;
    }

    .zone-back {
      position: absolute;
      top: 1rem;
      left: 1.5rem;
      font-size: 0.8rem;
      font-weight: 400;
      letter-spacing: 0.04em;
      text-transform: lowercase;
      color: var(--ink);
      cursor: pointer;
      z-index: 40;
      transition: border-color 0.2s ease;
      background: rgba(255, 255, 255, 0.94);
      padding: 7px 15px;
      border-radius: 999px;
      border: 1px solid var(--line);
    }

    .zone-back:hover {
      border-color: var(--ink);
    }

    .zone-other {
      padding: 2rem 2rem 0;
      text-align: center;
      border-top: 1px solid var(--line);
    }

    .zone-other-label {
      font-size: 0.78rem;
      color: var(--beluga);
      margin-bottom: 0.75rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }

    .zone-nav {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      padding: 1rem 2rem 3rem;
      flex-wrap: wrap;
    }

    .zone-nav-chip {
      font-size: 0.82rem;
      font-weight: 400;
      letter-spacing: 0.04em;
      text-transform: lowercase;
      padding: 8px 18px;
      border-radius: 999px;
      border: 2px solid var(--chip-accent, var(--pq-green));
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      transition: background 0.2s ease;
      font-family: 'Jost', sans-serif;
    }

    .zone-nav-chip:hover {
      background: var(--chip-accent, var(--pq-green));
    }

    @media (max-width: 900px) {
      .char-select-grid {
        max-width: 560px;
      }

      .char-card {
        flex-basis: 164px;
      }

      .char-select-brand {
        font-size: 3.25rem;
      }
    }

    @media (max-width: 768px) {
      .zone-hero {
        min-height: 320px;
      }

      .zone-hero-name {
        font-size: 2.3rem;
      }

      .zone-hero-avatar {
        width: 84px;
        height: 84px;
      }
    }

    @media (max-width: 560px) {
      .char-select {
        padding: 2.5rem 1rem;
      }

      .char-select-grid {
        gap: 0.75rem;
        max-width: 340px;
      }

      .char-card {
        flex-basis: calc(50% - 0.375rem);
        padding: 1.25rem 0.6rem 1.1rem;
      }

      .char-card-avatar {
        width: 68px;
        height: 68px;
        margin-bottom: 0.85rem;
      }

      .char-card-initials {
        font-size: 1.7rem;
      }

      .char-card-name {
        font-size: 1.05rem;
      }

      .char-card-role {
        font-size: 0.72rem;
        margin-bottom: 0.85rem;
      }

      .char-card-enter {
        font-size: 0.72rem;
        padding: 7px 14px;
      }

      .char-select-brand {
        font-size: 2.5rem;
      }

      .char-select-tagline {
        font-size: 1.25rem;
      }

      .char-select-subtitle {
        margin: 2.5rem 0 1.25rem;
      }

      .zone-hero {
        min-height: 280px;
        padding: 4rem 1rem 2.25rem;
      }

      .zone-hero-name {
        font-size: 2rem;
      }

      .zone-hero-tagline {
        font-size: 1rem;
        padding: 0 0.5rem;
      }

      .zone-back {
        top: 0.75rem;
        left: 0.75rem;
        font-size: 0.75rem;
      }

    }

    /* ===== TRY-ON ===== */
    .tryon-open {
      width: 100%;
      padding: 12px 30px;
      background: #fff;
      color: var(--ink);
      border: 2px solid var(--ink);
      border-radius: 999px;
      cursor: pointer;
      font-family: 'Jost', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: lowercase;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .tryon-open:hover {
      background: var(--ink);
      color: #fff;
    }

    .tryon-panel {
      background: var(--orbit-white);
      border-radius: var(--radius);
      padding: 1.25rem;
      position: relative;
    }

    .tryon-file {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .tryon-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 0.6rem;
    }

    .tryon-title {
      font-size: 0.85rem;
      font-weight: 500;
      text-transform: lowercase;
      letter-spacing: 0.05em;
    }

    .tryon-link {
      background: none;
      border: none;
      padding: 6px 0;
      font-family: 'Jost', sans-serif;
      font-size: 0.85rem;
      color: var(--ink);
      cursor: pointer;
      text-decoration: underline;
      text-decoration-color: var(--sky-blue);
      text-decoration-thickness: 2px;
      text-underline-offset: 4px;
      text-transform: lowercase;
    }

    .tryon-link:hover {
      text-decoration-color: var(--pq-green);
    }

    .tryon-link:disabled {
      color: #a8a8a8;
      text-decoration-color: #ddd;
      cursor: default;
    }

    .tryon-tip {
      font-size: 0.85rem;
      color: var(--ink-soft);
      line-height: 1.5;
      margin-bottom: 0.9rem;
    }

    .tryon-photo-row {
      display: flex;
      gap: 0.9rem;
      align-items: center;
      margin-bottom: 0.9rem;
    }

    .tryon-thumb {
      width: 56px;
      height: 84px;
      object-fit: cover;
      object-position: top;
      background: #eee;
      border-radius: 8px;
      flex: none;
    }

    .tryon-photo-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0 1rem;
    }

    .tryon-go {
      width: 100%;
      padding: 11px;
      font-size: 0.85rem;
    }

    .tryon-bar {
      height: 3px;
      background: rgba(42, 42, 42, 0.08);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 0.75rem;
      position: relative;
    }

    .tryon-bar::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: -40%;
      width: 40%;
      background: var(--pq-green);
      animation: tryon-slide 1.2s ease-in-out infinite;
    }

    @keyframes tryon-slide {
      from { left: -40%; }
      to { left: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      .tryon-bar::after {
        animation: none;
        left: 0;
        width: 100%;
        opacity: 0.5;
      }
    }

    .tryon-status {
      font-size: 0.85rem;
      color: var(--ink);
      line-height: 1.5;
    }

    .tryon-status:not(:empty) {
      margin-top: 0.75rem;
    }

    .tryon-status.tryon-error {
      color: var(--error);
    }

    .tryon-note {
      font-size: 0.76rem;
      color: var(--ink-soft);
      line-height: 1.5;
      margin-top: 0.75rem;
    }

    .tryon-view {
      position: absolute;
      left: 50%;
      bottom: 0.9rem;
      transform: translateX(-50%);
      display: flex;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid var(--line);
      border-radius: 999px;
      overflow: hidden;
      white-space: nowrap;
    }

    .tryon-view-btn {
      background: none;
      border: none;
      padding: 9px 15px;
      font-family: 'Jost', sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.04em;
      text-transform: lowercase;
      color: var(--ink-soft);
      cursor: pointer;
    }

    .tryon-view-btn.active {
      background: var(--ink);
      color: #fff;
    }

    /* ===== THE OUTFIT A CREW MEMBER SHOWS ===== */
    .outfit-by {
      font-size: 0.78rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--beluga);
    }

    .outfit-note {
      font-size: 1.15rem;
      font-weight: 300;
      font-style: italic;
      color: var(--ink);
      line-height: 1.5;
      margin-top: 0.5rem;
    }

    .outfit-pieces {
      display: flex;
      flex-direction: column;
    }

    .outfit-piece {
      display: flex;
      align-items: baseline;
      gap: 1rem;
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--line);
    }

    .outfit-piece-name {
      font-size: 1.05rem;
      text-transform: lowercase;
      letter-spacing: 0.02em;
    }

    .outfit-piece-price {
      margin-left: auto;
      font-size: 0.9rem;
      color: var(--ink-soft);
    }

    .outfit-total {
      display: flex;
      justify-content: space-between;
      padding-top: 0.75rem;
      font-size: 0.9rem;
      font-weight: 500;
      text-transform: lowercase;
    }

    .outfit-photos {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 1fr;
      gap: 1px;
      height: 100%;
      min-height: 400px;
    }

    .outfit-photos img {
      width: 100%;
      height: 100%;
      min-height: 0;
      object-fit: cover;
      object-position: top;
    }

    @media (max-width: 768px) {
      .modal-image.tryon-look {
        max-height: 70vh;
      }

      .outfit-photos {
        min-height: 300px;
        height: 50vh;
      }
    }

    /* On a wide screen the details scroll on their own, so the picture stays in view. */
    @media (min-width: 769px) {
      .modal-details {
        max-height: 92vh;
        overflow-y: auto;
      }
    }

    /* ===== YOUR GUIDE: THE CHAT =====
       A crew member comes along as her guide. On a wide screen the chat is a rail down
       the right side. On a narrow one it is a bar at the bottom that opens into a sheet. */
    :root {
      --guide-w: 384px;
      --guide-bar: 64px;
      --nav-h: 76px;
      --kb: 0px;   /* how much an on-screen keyboard covers, set by the page */
    }

    .guide {
      position: fixed;
      right: 0;
      bottom: var(--kb);
      background: #fff;
      display: flex;
      flex-direction: column;
      --guide-accent: var(--pq-green);
      --guide-tint: #e9f6e8;
    }

    .guide-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .guide-head,
    .guide-bar {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.8rem 1rem;
      border-bottom: 1px solid var(--line);
      text-align: left;
    }

    .guide-bar {
      width: 100%;
      min-height: var(--guide-bar);
      background: #fff;
      border: none;
      border-bottom: 1px solid transparent;
      font: inherit;
      color: inherit;
      text-transform: lowercase;
      cursor: pointer;
    }

    .guide-face {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      overflow: hidden;
      flex: none;
      box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--guide-accent);
      margin: 4px;
    }

    .guide-face img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
    }

    .guide-face .char-card-initials {
      font-size: 1.1rem;
    }

    .guide-who {
      flex: 1;
      min-width: 0;
    }

    .guide-name {
      font-size: 1.05rem;
      font-weight: 400;
      letter-spacing: 0.02em;
      line-height: 1.2;
    }

    .guide-state {
      font-size: 0.8rem;
      color: var(--ink-soft);
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .guide-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--guide-accent);
      margin-right: 0.4rem;
      animation: pulse-dot 1.5s ease-in-out infinite;
    }

    .guide-chevron {
      flex: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      color: var(--ink-soft);
    }

    .guide-thread {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    /* each thing in the thread keeps its own height: the thread scrolls, it does not squeeze */
    .guide-thread > * {
      flex-shrink: 0;
    }

    .guide-hello {
      margin: auto 0;
      text-align: center;
      padding: 1rem 0.5rem;
    }

    .guide-hello-line {
      font-size: 1.25rem;
      font-weight: 300;
      line-height: 1.4;
      margin-bottom: 0.4rem;
    }

    .guide-hello-sub {
      font-size: 0.9rem;
      color: var(--ink-soft);
      line-height: 1.5;
      margin-bottom: 1.25rem;
    }

    .guide-chips {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    .guide-chip {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 16px;
      font: inherit;
      font-size: 0.88rem;
      color: var(--ink);
      text-transform: lowercase;
      cursor: pointer;
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .guide-chip:hover:not(:disabled) {
      border-color: var(--guide-accent);
      background: var(--guide-tint);
    }

    .guide-chip:disabled {
      color: #a8a8a8;
      cursor: default;
    }

    .guide-say {
      max-width: 86%;
      padding: 0.6rem 0.9rem;
      border-radius: 16px;
      font-size: 0.95rem;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .guide-say.crew {
      align-self: flex-start;
      background: var(--guide-tint);
      border-bottom-left-radius: 6px;
    }

    .guide-say.me {
      align-self: flex-end;
      background: var(--orbit-white);
      border-bottom-right-radius: 6px;
    }

    .guide-aside {
      align-self: center;
      font-size: 0.78rem;
      color: var(--ink-soft);
      text-align: center;
      padding: 0.2rem 0.5rem;
    }

    .guide-pick {
      align-self: stretch;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: #fff;
      overflow: hidden;
    }

    .guide-pick-by {
      padding: 0.6rem 0.9rem 0;
      font-size: 0.72rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--beluga);
    }

    .guide-pick-note {
      padding: 0.15rem 0.9rem 0;
      font-size: 1rem;
      font-weight: 300;
      font-style: italic;
      line-height: 1.4;
    }

    .guide-piece {
      display: flex;
      gap: 0.8rem;
      padding: 0.8rem 0.9rem;
    }

    .guide-piece + .guide-piece {
      border-top: 1px solid var(--line);
    }

    .guide-piece-photo {
      flex: none;
      width: 84px;
      height: 112px;
      padding: 0;
      border: none;
      border-radius: 10px;
      overflow: hidden;
      background: var(--orbit-white);
      cursor: pointer;
    }

    .guide-piece-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top 20%;
      transition: filter 0.4s ease;
    }

    .guide-piece-main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }

    .guide-piece-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .guide-piece-name {
      font-size: 0.98rem;
      letter-spacing: 0.02em;
    }

    .guide-piece-price {
      font-size: 0.9rem;
      color: var(--ink-soft);
    }

    .guide-piece-colors {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .guide-color {
      width: 22px;
      height: 22px;
      padding: 0;
      border-radius: 50%;
      border: 1px solid rgba(42, 42, 42, 0.18);
      cursor: pointer;
    }

    .guide-color.selected {
      box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--ink);
    }

    .guide-color-name {
      font-size: 0.78rem;
      color: var(--ink-soft);
      margin-left: 0.2rem;
    }

    .guide-piece-sizes {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .guide-piece-sizes .size-option {
      min-width: 32px;
      padding: 5px 4px;
      font-size: 0.7rem;
      letter-spacing: 0.02em;
    }

    .guide-piece-actions {
      display: flex;
      align-items: center;
      gap: 0.9rem;

          var w = img.naturalWidth, hgt = img.naturalHeight;
          if (Math.min(w, hgt) < 256) {
            URL.revokeObjectURL(src);
            reject(new Error('that photo is too small. try a bigger one.'));
            return;
          }
          var scale = Math.min(1, 1536 / Math.max(w, hgt));
          var canvas = document.createElement('canvas');
          canvas.width = Math.round(w * scale);
          canvas.height = Math.round(hgt * scale);
          var ctx = canvas.getContext('2d');
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.imageSmoothingQuality = 'high';
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          URL.revokeObjectURL(src);
          var out = '';
          var qualities = [0.9, 0.8, 0.7];
          for (var i = 0; i < qualities.length; i++) {
            out = canvas.toDataURL('image/jpeg', qualities[i]);
            if (out.length < 2400000) break;
          }
          if (out.indexOf('data:image/jpeg') !== 0 || out.length >= 2400000) {
            reject(new Error("we couldn't get that photo ready. try a different one."));
            return;
          }
          resolve(out);
        };
        img.onerror = function() {
          URL.revokeObjectURL(src);
          reject(new Error("we couldn't open that photo. try a jpg or png."));
        };
        img.src = src;
      });
    }

    // One request to a try-on address. Resolves with the answer, or rejects with an Error
    // whose message says what went wrong. err.retry means the trouble may pass on its own.
    function tryonAsk(url, opts) {
      return fetch(url, opts).then(function(res) {
        return res.text().then(function(text) {
          var data = null;
          try { data = JSON.parse(text); } catch (e) { data = null; }
          if (res.ok && data && data.ok) return data;
          var err;
          if (data && data.message) {
            err = new Error(data.message);
            err.retry = !!data.retry;
          } else if (res.status === 429) {
            err = new Error("that's a lot of looks at once. wait a minute and try again.");
            err.retry = true;
          } else if (res.status === 404) {
            err = new Error("try-on isn't switched on for this site yet.");
          } else {
            err = new Error('try-on had a problem (' + res.status + '). try again.');
            err.retry = res.status >= 500;
          }
          throw err;
        });
      }, function() {
        var err = new Error("couldn't reach try-on. check your connection and try again.");
        err.retry = true;
        throw err;
      });
    }

    // Keep asking until the look is done. `alive` goes false when the shopper has moved on.
    function tryonWait(id, started, alive) {
      var misses = 0;
      return new Promise(function(resolve, reject) {
        var ask = function() {
          if (!alive()) return;
          if (Date.now() - started > TRYON_GIVE_UP) {
            reject(new Error('this is taking too long. try again.'));
            return;
          }
          tryonAsk(TRYON_STATUS + '?id=' + encodeURIComponent(id)).then(function(d) {
            misses = 0;
            if (d.state === 'done' && d.image) {
              resolve(d.image);
              return;
            }
            setTimeout(ask, TRYON_ASK_EVERY);
          }, function(err) {
            misses += 1;
            if (err.retry && misses < 4) {
              setTimeout(ask, TRYON_ASK_EVERY);
              return;
            }
            reject(err);
          });
        };
        setTimeout(ask, TRYON_ASK_EVERY);
      });
    }

    // Make one look: put the pieces on, one pass each. The picture from one pass is the
    // photo for the next. Resolves with the last picture.
    function tryonLook(pieces, photo, alive) {
      var step = function(i, picture) {
        if (i >= pieces.length) return Promise.resolve(picture);
        if (picture.indexOf('data:image/') !== 0) {
          return Promise.reject(new Error("try-on couldn't put on the second piece. try again."));
        }
        var started = Date.now();
        return tryonAsk(TRYON_START, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ product: pieces[i].id, photo: picture })
        }).then(function(d) {
          return tryonWait(d.id, started, alive);
        }).then(function(image) {
          return step(i + 1, image);
        });
      };
      return step(0, photo);
    }

    // The try-on panel. `pieces` is one product, or two for an outfit (in the order they go on).
    // `autoGo` is a number that changes each time a look should start on its own.
    // `lookRef`, in the outfit window only, is where the app reads how her look stands:
    // none | reading (she is choosing a photo, or it is being read) | making | made.
    function TryOn({ pieces, photo, setPhoto, look, onLook, startOpen, autoGo, onDone, lookRef }) {
      const [open, setOpen] = useState(!!startOpen);

      const [message, setMessage] = useState('');
      const [nudge, setNudge] = useState(0);
      var fileRef = React.useRef(null);
      var panelRef = React.useRef(null);
      var runRef = React.useRef(0);
      var two = pieces.length > 1;
      // Set as things happen, not as the page draws: a press can arrive before the next draw.
      var mark = function(state) { if (lookRef) lookRef.current = state; };

      // On a phone the panel can sit half off the screen. Bring it into view when she is
      // using it, so the button and any message are in front of her.
      var showPanel = function() { setNudge(function(n) { return n + 1; }); };
      useEffect(function() {
        var p = panelRef.current;
        if (!nudge || !p || !p.scrollIntoView) return;
        var calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        p.scrollIntoView({ block: 'nearest', behavior: calm ? 'auto' : 'smooth' });
      }, [nudge]);

      // Leaving the window stops any look still being made.
      useEffect(function() {
        return function() { runRef.current = -1; };
      }, []);

      var busy = phase === 'opening' || phase === 'working';

      var pick = function() {
        if (busy || !fileRef.current) return;
        mark('reading'); // from the moment the chooser opens, she is adding or changing her photo
        fileRef.current.click();
      };

      // She shut the chooser without choosing: her look stands as it did.
      var madeRef = React.useRef(false);
      madeRef.current = !!look;
      useEffect(function() {
        var input = fileRef.current;
        if (!input) return;
        var back = function() { mark(madeRef.current ? 'made' : 'none'); };
        input.addEventListener('cancel', back);
        return function() { input.removeEventListener('cancel', back); };
      }, [open]);

      var onFile = function(e) {
        var file = e.target.files && e.target.files[0];
        e.target.value = '';
        if (!file) { mark(look ? 'made' : 'none'); return; }
        if (busy) return;
        var my = ++runRef.current;
        setPhase('opening');
        setMessage('');
        mark('reading');
        fitPhoto(file).then(function(dataUrl) {
          if (runRef.current !== my) return;
          onLook(null);
          setPhoto(dataUrl);
          setPhase('idle');
          mark('none');
          showPanel();
        }, function(err) {
          if (runRef.current !== my) return;
          setPhase('error');
          setMessage(err.message);
          mark(look ? 'made' : 'none');
          showPanel();
        });
      };

      var remove = function() {
        if (busy) return;
        runRef.current += 1;
        onLook(null);
        setPhoto(null);
        setPhase('idle');
        setMessage('');
        mark('none');
      };

      var go = function() {
        if (!photo || busy) return;
        var my = ++runRef.current;
        var alive = function() { return runRef.current === my; };
        setPhase('working');
        setMessage('');
        mark('making');
        showPanel();
        tryonLook(pieces, photo, alive).then(function(image) {
          if (!alive()) return;
          setPhase('idle');
          mark('made');
          onLook(image);
          if (onDone) onDone(true, '');
        }, function(err) {
          if (!alive()) return;
          var words = err.message || 'try-on had a problem. try again.';
          setPhase('error');
          setMessage(words);
          mark(look ? 'made' : 'none');
          showPanel();
          if (onDone) onDone(false, words);
        });
      };

      // A crew member showed this outfit and her photo is already in: start without a tap.
      useEffect(function() {
        if (autoGo && photo) go();

      }, [autoGo]);

      if (!open) {
        return el('button', { className: 'tryon-open', onClick: function() { setOpen(true); showPanel(); } }, 'try it on');
      }

      var waistUp = pieces.every(function(p) { return p.category === 'tops'; });
      var tip = waistUp
        ? 'use a photo of you facing the camera, from the waist up or full length.'
        : 'use a full-length photo of you, facing the camera.';

      var status = '';
      if (phase === 'working') status = two ? 'this takes about half a minute.' : 'this takes about 15 seconds.';
      else if (phase === 'error') status = message;
      else if (look) status = two ? "here's your look, in the colors we photographed." : "here's your look, in the color we photographed.";

      var goLabel = 'see it on me';
      if (phase === 'working') goLabel = 'making your look…';
      else if (phase === 'error') goLabel = 'try again';
      else if (look) goLabel = 'make it again';

      var saveName = 'piper-and-quinn-' + pieces.slice().reverse().map(pieceKey).join('-') + '.jpg';

      return el('div', { className: 'tryon-panel', ref: panelRef },
        el('div', { className: 'tryon-head' },
          el('div', { className: 'tryon-title' }, 'try it on'),
          el('button', { className: 'tryon-link', onClick: function() { setOpen(false); } }, 'close')),
        el('input', { ref: fileRef, type: 'file', accept: 'image/*', onChange: onFile, className: 'tryon-file', tabIndex: -1, 'aria-hidden': 'true' }),
        photo ? (
          el(React.Fragment, null,
            el('div', { className: 'tryon-photo-row' },
              el('img', { className: 'tryon-thumb', src: photo, alt: 'your photo' }),
              el('div', { className: 'tryon-photo-links' },
                el('button', { className: 'tryon-link', disabled: busy, onClick: pick }, 'change photo'),
                el('button', { className: 'tryon-link', disabled: busy, onClick: remove }, 'remove photo'))),
            el('button', { className: 'tryon-go', disabled: busy, onClick: go }, goLabel))
        ) : (
          el(React.Fragment, null,
            el('div', { className: 'tryon-tip' }, tip),
            el('button', { className: 'tryon-go', disabled: busy, onClick: pick }, phase === 'opening' ? 'opening your photo…' : 'choose a photo'))
        ),
        phase === 'working' && el('div', { className: 'tryon-bar' }),
        el('div', { className: 'tryon-status' + (phase === 'error' ? ' tryon-error' : ''), role: 'status', 'aria-live': 'polite' }, status),
        look && !busy && el('a', { className: 'tryon-link', href: look, download: saveName, style: { display: 'inline-block' } }, 'save picture'),
        el('div', { className: 'tryon-note' }, "your photo goes to fashn, our try-on partner, to make the picture. we don't keep it."));
    }

    // ===== THE CREW AS GUIDES =====
    // A crew member is a voice agent at ElevenLabs. The page talks with the agent through
    // ElevenLabs' client library (vendor/), by voice or in writing, and draws the
    // conversation itself: what is said, and each piece she talks about, with its own
    // "add to cart". An agent may also have one button on this page, show_outfit: it names
    // a dress, or a top and a bottom, and the page shows them. If her photo is in, the page
    // puts the outfit on her.
    var STYLIST_FREE_LOOKS = 5; // looks a crew member may start without her tap, per visit
    var OUTFIT_ORDER = ['bottoms', 'tops', 'dresses']; // the order pieces go on

    // "The Burgundy Polo" -> "burgundy-polo": the name the agent uses for a piece.
    function pieceKey(product) {
      return product.name.toLowerCase().replace(/^the\s+/, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    }

    function findPiece(said) {
      if (said == null) return null;
      var key = String(said).toLowerCase().replace(/^\s*the\s+/, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
      if (!key) return null;
      return PRODUCTS.find(function(p) { return p.tryOn && (pieceKey(p) === key || String(p.id) === key); }) || null;
    }

    // Read what the agent asked for. Returns { pieces, note, problem }.
    function readOutfit(params) {
      params = params || {};
      var asked = [params.dress, params.top, params.bottom].concat(Array.isArray(params.pieces) ? params.pieces : []);
      var named = asked.filter(function(x) { return x != null && String(x).trim() !== ''; });
      var unknown = [];
      var found = [];
      named.forEach(function(x) {
        var p = findPiece(x);
        if (!p) unknown.push(String(x).slice(0, 40));
        else if (found.indexOf(p) === -1) found.push(p);
      });
      var names = PRODUCTS.filter(function(p) { return p.tryOn; }).map(pieceKey).join(', ');
      if (!found.length) {
        return { pieces: [], problem: (unknown.length ? 'No piece is called ' + unknown.join(' or ') + '. ' : 'No piece was named. ') + 'The pieces are: ' + names + '.' };
      }
      var problem = unknown.length ? 'No piece is called ' + unknown.join(' or ') + '. ' : '';
      var dress = found.find(function(p) { return p.category === 'dresses'; });
      var top = found.find(function(p) { return p.category === 'tops'; });
      var bottom = found.find(function(p) { return p.category === 'bottoms'; });
      var pieces;
      if (dress) {
        pieces = [dress];
        if (found.length > 1) problem += 'A dress is worn on its own, so only the dress is shown. ';
      } else {
        pieces = [bottom, top].filter(Boolean);
        if (found.length > pieces.length) problem += 'An outfit is one top with one bottom, so only one of each is shown. ';
      }
      pieces.sort(function(a, b) { return OUTFIT_ORDER.indexOf(a.category) - OUTFIT_ORDER.indexOf(b.category); });
      var note = typeof params.note === 'string' ? params.note.replace(/\s+/g, ' ').trim().slice(0, 160) : '';
      return { pieces: pieces, note: note, problem: problem };
    }

    // What the rest of the page may do with the conversation that is up. The chat sets these.
    var crewDesk = {
      tell: function() {},   // say something to the crew member without interrupting her
      fold: function() {},   // on a narrow screen, fold the chat down to its bar
      talk: function() {},   // open the chat and start talking
    };

    // Tell the crew member something without interrupting her (she cannot see the screen).
    function tellCrew(message) {
      crewDesk.tell(message);
    }

    // On a narrow screen the open chat covers most of the page. Fold it down to its bar so an
    // outfit can be seen. The conversation carries on.
    function foldCrewChat() {
      crewDesk.fold();
    }

    // The resampler the library loads for an iPhone, an iPad and Safari on a Mac. Kept with
    // the site, so a call does not hang on a second address.
    var CREW_RESAMPLER = 'vendor/libsamplerate-2.1.2.worklet.js';

    // End a conversation from the page's side. Ending one that has ended does nothing.
    function endCrewCall(call) {
      try {
        var ending = call.endSession();
        if (ending && ending.catch) ending.catch(function() {});
      } catch (e) {}
    }

    // Why a conversation could not start, in words for her.
    function crewTrouble(err, member, written) {
      var name = err && err.name;
      if (!written && (name === 'NotAllowedError' || name === 'PermissionDeniedError' || name === 'SecurityError')) {
        return 'the microphone is off for this site. turn it on in your browser, or type instead.';
      }
      if (!written && (name === 'NotFoundError' || name === 'NotReadableError' || name === 'OverconstrainedError')) {
        return "we couldn't find a microphone. you can type instead.";
      }
      return "couldn't reach " + member.name.toLowerCase() + '. check your connection and try again.';
    }

    // What was said, tidied for reading: a voice may carry stage directions in square brackets
    // ("[laughs]") and marks meant for a formatter. Neither belongs in a chat bubble.
    function crewWords(words) {
      return String(words || '')
        .replace(/\[[a-z][a-z ,'-]{0,28}\]/gi, ' ')
        .replace(/\*\*|__|`/g, '')
        .replace(/\s+/g, ' ')
        .trim();
    }

    // Start one conversation with a crew member, by voice or in writing. Returns at once with
    // { end, say, tell, mute, ready }: `ready` settles when the conversation is up, and `end`
    // may be called at any time, also before that.
    // hooks: onSay(who, words), onMode(mode), onOver(why)
    function openCrewTalk(member, written, tools, hooks) {
      var talk = { call: null, over: false };
      var settle = function(why) {
        if (talk.settled) return;
        talk.settled = true;
        hooks.onOver(why);
      };
      talk.end = function() {
        talk.over = true;
        talk.settled = true; // she ended it herself: nothing to tell her
        if (talk.call) endCrewCall(talk.call);
      };
      talk.say = function(words) {
        if (talk.call && !talk.over) try { talk.call.sendUserMessage(words); return true; } catch (e) {}
        return false;
      };
      talk.tell = function(words) {
        if (talk.call && !talk.over) try { talk.call.sendContextualUpdate(words); } catch (e) {}
      };
      talk.mute = function(off) {
        if (talk.call && !talk.over) try { talk.call.setMicMuted(!!off); } catch (e) {}
      };

      if (!lib || !lib.Conversation) {
        var missing = new Error('the voice library is not here');
        missing.name = 'NoLibrary';
        talk.ready = Promise.reject(missing);
        return talk;
      }
      talk.ready = lib.Conversation.startSession({
        agentId: member.agentId,
        connectionType: 'websocket',
        textOnly: !!written,
        clientTools: tools,
        libsampleratePath: CREW_RESAMPLER,
        // The library hands the conversation over a moment before it has finished bringing it
        // up. If she has gone by then, end it once that moment has passed: a conversation
        // ended any sooner is marked as up again by the library and left running.
        onConversationCreated: function(call) {
          talk.call = call;
          Promise.resolve().then(function() { if (talk.over) endCrewCall(call); });
        },
        onMessage: function(m) {
          if (talk.over || !m || typeof m.message !== 'string') return;
          var words = crewWords(m.message);
          if (!words) return;
          hooks.onSay(m.role === 'user' || m.source === 'user' ? 'me' : 'crew', words);
        },
        onModeChange: function(m) { if (!talk.over && m) hooks.onMode(m.mode); },
        onDisconnect: function(details) {

          talk.over = true;
          settle(why === 'user' ? 'ended' : why === 'agent' ? 'hung-up' : 'dropped');
        },
        onError: function() {},
      }).then(function(call) {
        talk.call = call;
        if (talk.over) endCrewCall(call);
        return talk;
      });
      return talk;
    }

    // The pieces a line of talk names, in the order they come up. A piece is known by its
    // name without "the", and by a few other things people call it.
    var PIECE_ALSO = { 2: ['pink sweater'], 3: ['polka-dot dress', 'dot dress'], 4: ['lime dress', 'polo dress'], 5: ['blue polo'], 6: ['white skirt'], 7: ['ruffled skirt', 'tiered skirt'] };
    var PIECE_WORDS = PRODUCTS.map(function(p) {
      var words = [p.name.toLowerCase().replace(/^the\s+/, '')].concat(PIECE_ALSO[p.id] || []);
      var loose = words.map(function(w) { return w.replace(/[^a-z0-9]+/g, '[^a-z0-9]+'); });
      return { piece: p, find: new RegExp('(^|[^a-z0-9])(' + loose.join('|') + ')(e?s)?(?![a-z0-9])', 'i') };
    });

    function piecesNamed(words) {
      var found = [];
      PIECE_WORDS.forEach(function(w) {
        var m = w.find.exec(String(words || ''));
        if (m) found.push({ piece: w.piece, at: m.index });
      });
      found.sort(function(a, b) { return a.at - b.at; });
      return found.map(function(f) { return f.piece; });
    }

    // How a piece's photo is tinted to show a color (the photos are of one color each).
    function colorFilter(product, colorId) {
      var colorObj = COLORWAYS.find(function(c) { return c.id === colorId; });
      if (!colorObj) return 'none';
      var targetHue = hexToHue(colorObj.hex);
      var baseHue = product.baseHue || 0;
      var rotation = targetHue - baseHue;
      // For white/near-white, desaturate instead of rotating
      var r = parseInt(colorObj.hex.slice(1, 3), 16);
      var g = parseInt(colorObj.hex.slice(3, 5), 16);
      var b = parseInt(colorObj.hex.slice(5, 7), 16);
      var maxC = Math.max(r, g, b), minC = Math.min(r, g, b);
      var saturation = maxC === 0 ? 0 : (maxC - minC) / maxC;
      if (saturation < 0.1) {
        // Near-white or neutral — desaturate and brighten
        return 'saturate(0.15) brightness(1.3)';
      }
      if (colorObj.id === 'midnight') {
        return 'hue-rotate(' + rotation + 'deg) brightness(0.4) saturate(0.6)';
      }
      return 'hue-rotate(' + rotation + 'deg) saturate(1.1)';
    }

    function colorName(colorId) {
      var colorObj = COLORWAYS.find(function(c) { return c.id === colorId; });
      return colorObj ? colorObj.name.toLowerCase() : colorId;
    }

    function MicIcon() {
      return el('svg', { viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round', 'aria-hidden': 'true' },
        el('rect', { x: 9, y: 2, width: 6, height: 12, rx: 3 }),
        el('path', { d: 'M5 11a7 7 0 0 0 14 0' }),
        el('path', { d: 'M12 18v4' }));
    }

    // A piece as it shows in the chat: its photo, its price, a color, a size, "add to cart".
    function ChatPiece({ product, onAdd, onView }) {
      const [color, setColor] = useState(product.colorways[0]);
      const [size, setSize] = useState(null);
      const [added, setAdded] = useState(0);

      var add = function() {
        if (!size) return;
        onAdd(product, color, size);
        setAdded(function(n) { return n + 1; });
      };

      return el('div', { className: 'guide-piece', 'data-piece': pieceKey(product) },
        el('button', { className: 'guide-piece-photo', onClick: function() { onView(product); }, 'aria-label': 'view ' + product.name.toLowerCase() },
          el('img', { src: product.imageUrl, alt: '', style: { filter: colorFilter(product, color) } })),
        el('div', { className: 'guide-piece-main' },
          el('div', { className: 'guide-piece-top' },
            el('span', { className: 'guide-piece-name' }, product.name),
            el('span', { className: 'guide-piece-price' }, '$' + product.price)),
          el('div', { className: 'guide-piece-colors', role: 'group', 'aria-label': 'color' },
            product.colorways.map(function(cw) {
              var c = COLORWAYS.find(function(x) { return x.id === cw; });
              if (!c) return null;
              return el('button', { key: cw, className: 'guide-color' + (color === cw ? ' selected' : ''), style: { backgroundColor: c.hex }, title: c.name.toLowerCase(), 'aria-label': c.name.toLowerCase(), 'aria-pressed': color === cw, onClick: function() { setColor(cw); } });
            }),
            el('span', { className: 'guide-color-name' }, colorName(color))),
          el('div', { className: 'guide-piece-sizes', role: 'group', 'aria-label': 'size' },

              return el('button', { key: sz, className: 'size-option' + (size === sz ? ' selected' : ''), 'aria-pressed': size === sz, onClick: function() { setSize(sz); } }, sz);
            })),
          el('div', { className: 'guide-piece-actions' },
            el('button', { className: 'btn-primary guide-add', disabled: !size, onClick: add }, !size ? 'pick a size' : added ? 'added. add another' : 'add to cart'),
            el('button', { className: 'tryon-link', onClick: function() { onView(product); } }, 'view'))));
    }

    // The chat with her guide. It stays with her from page to page until she goes back to
    // the crew or picks another guide. `onShowOutfit` is the page's answer to the agent's

            el('h3', { className: 'studio-heading' }, 'your design'),
            el('div', { className: 'garment-preview', style: { backgroundColor: currentColor?.hex, backgroundImage: currentPattern?.pattern, borderRadius: '12px', boxShadow: '0 2px 8px rgba(0,0,0,0.08)', marginBottom: '1rem' } }),
            el('div', { className: 'studio-caption' }, currentColor?.name, ', ', currentPattern?.name),
            el('button', { className: 'btn-primary', style: { marginTop: '1.75rem' }, onClick: () => setAsked(true) }, 'add to cart'),
            // A design of her own cannot be bought yet. Say so, rather than do nothing.
            el('div', { className: 'btn-note', role: 'status' }, asked ? "a design of your own can't be bought yet. this studio is a preview." : ''))));
    }

    function CartPage({ cart, setCart }) {
      const [asked, setAsked] = useState(false);
      const total = cart.reduce((sum, item) => sum + (item.product.price * item.qty), 0);

      const removeItem = (index) => {
        setCart(cart.filter((_, i) => i !== index));
      };

      const updateQuantity = (index, newQty) => {
        if (newQty < 1) {
          removeItem(index);
        } else {
          const newCart = [...cart];
          newCart[index] = { ...newCart[index], qty: newQty };
          setCart(newCart);
        }
      };

      const colorName = (id) => {
        const color = COLORWAYS.find(c => c.id === id);
        return color ? color.name : id;
      };

      return el('div', { className: 'main-content fade-in' },
        el('h1', { className: 'page-title' }, 'your cart'),
        cart.length === 0 ? (
          el('div', { className: 'cart-empty' },
            el('p', null, 'your cart is empty'),
            el('p', null, 'add some pieces to get started'))
        ) : (
          el(React.Fragment, null,
            el('div', { style: { maxWidth: '700px', margin: '0 auto' } }, cart.map((item, idx) =>
              el('div', { key: idx, className: 'cart-item' },
                el('div', { className: 'cart-item-details' },
                  el('div', { className: 'cart-item-name' }, item.product.name),
                  el('div', { className: 'cart-item-meta' }, item.colorway && el('span', null, colorName(item.colorway), ' • '), item.size && el('span', null, 'size ', item.size, ' • '), '$', item.product.price)),
                el('div', { className: 'quantity-control' },
                  el('button', { className: 'qty-button', 'aria-label': 'one fewer', onClick: () => updateQuantity(idx, item.qty - 1) }, '-'),
                  el('span', null, item.qty),
                  el('button', { className: 'qty-button', 'aria-label': 'one more', onClick: () => updateQuantity(idx, item.qty + 1) }, '+'),
                  el('span', { style: { marginLeft: '1rem', fontWeight: '500' } }, '$', item.product.price * item.qty))))),
            el('div', { className: 'cart-totals' },
              el('div', null, el('span', null, 'subtotal'), el('span', null, '$', total.toFixed(2))),
              el('div', { className: 'soft' }, el('span', null, 'shipping'), el('span', null, 'calculated at checkout')),
              el('div', { className: 'sum' }, el('span', null, 'total'), el('span', null, '$', total.toFixed(2)))),
            el('div', { style: { textAlign: 'center', margin: '2rem 0' } },
              el('button', { className: 'btn-primary', style: { padding: '15px 48px' }, onClick: () => setAsked(true) }, 'proceed to checkout'),
              // There is no checkout yet. Say so, rather than do nothing.
              el('div', { className: 'btn-note', role: 'status' }, asked ? "checkout isn't open yet. this site is a preview." : '')))));
    }

    function CrewZone({ memberIdx, onSelectProduct, onBack, onSwitchZone }) {
      var member = CREW_MEMBERS[memberIdx];

      var zoneProducts = member.productIds.map(function(id) {
        return PRODUCTS.find(function(p) { return p.id === id; });
      }).filter(Boolean);

      return el('div', { className: 'zone-page', style: { '--zone-accent': member.accent } },
        el('div', { className: 'zone-back', onClick: onBack }, '← back to crew'),
        el('div', { className: 'zone-hero', style: { background: 'linear-gradient(180deg, ' + tint(member.accent, 0.7) + ' 0%, ' + tint(member.accent, 0.9) + ' 100%)' } },
          el('div', { className: 'zone-hero-content' },
            el(CrewAvatar, { member: member, className: 'zone-hero-avatar' }),
            el('h1', { className: 'zone-hero-name' }, member.name),
            el('div', { className: 'zone-hero-role' }, member.role),
            el('div', { className: 'zone-hero-tagline' }, member.zoneTagline))),
        el('div', { className: 'zone-talk', style: { background: member.accent } },
          el('span', null, member.name, ' is your guide now.'),
          el('button', { className: 'zone-talk-btn', onClick: function() { crewDesk.talk(); } }, el(MicIcon, null), 'talk to ' + member.name.toLowerCase())),
        el('div', { className: 'zone-section' },
          el('p', { className: 'zone-desc' }, member.zoneDesc),
          el('h2', { className: 'zone-section-title' }, member.name.toLowerCase() + "'s picks"),
          el('div', { className: 'zone-products' }, zoneProducts.map(function(product) {
            return el('div', { key: product.id, className: 'product-card', onClick: function() { onSelectProduct(product); } },
              el('div', { className: 'product-card-image-wrapper' },
                el('img', { src: product.imageUrl, alt: product.name, className: 'product-image' })),
              el('div', { className: 'product-info' },
                el('div', { className: 'product-name' }, product.name),
                el('div', { className: 'product-price' }, '$' + product.price)));
          }))),
        el('div', { className: 'zone-other' }, el('div', { className: 'zone-other-label' }, 'visit another zone')),
        el('div', { className: 'zone-nav' }, CREW_MEMBERS.map(function(m, idx) {
          if (idx === memberIdx) return null;
          return el('button', { key: m.name, className: 'zone-nav-chip', style: { '--chip-accent': m.accent }, onClick: function() { onSwitchZone(idx); } }, m.name.toLowerCase() + "'s zone");
        })));
    }

    function Footer({ navigateTo }) {
      var link = function(page, words) {
        return el('button', { className: 'footer-link', onClick: function() { navigateTo(page); } }, words);
      };
      return el('div', { className: 'footer' },
        el('div', { className: 'color-rule' }),
        el('div', { className: 'footer-content' },
          el('div', null,
            el('div', { className: 'footer-brand' }, el(Wordmark, null)),
            el('div', { className: 'tagline footer-tagline' }, 'dress bold.'),
            el('div', { className: 'footer-place' }, 'fashion by sisters. san francisco, california.')),
          el('div', { className: 'footer-links' }, link('home', 'the crew'), link('shop', 'shop'), link('studio', 'studio'), link('cart', 'cart'))),
        el('div', { className: 'footer-legal' }, '© 2026 piper & quinn'));
    }

    function App() {
      const [currentPage, setCurrentPage] = useState('home');
      const [cart, setCart] = useState([]);
      const [selectedProduct, setSelectedProduct] = useState(null);
      const [activeZoneIdx, setActiveZoneIdx] = useState(null);
      const [tryPhoto, setTryPhoto] = useState(null);
      const [outfit, setOutfit] = useState(null);
      var tryPhotoRef = React.useRef(null);
      tryPhotoRef.current = tryPhoto;
      var freeLooksRef = React.useRef(0);
      // The outfit that is up, as of the last press or close. Kept here and set as things
      // happen: a second press can arrive before the page has drawn the first. Each outfit
      // carries how her look in its window stands, in `look` (see TryOn).
      var outfitRef = React.useRef(null);
      var openPieceRef = React.useRef(null);
      openPieceRef.current = selectedProduct;

      var closeOutfit = function() {
        outfitRef.current = null;
        setOutfit(null);
      };

      // A crew member pressed show_outfit. Show it, and answer her with what happened.
      var handleShowOutfit = function(params, member) {
        var asked = readOutfit(params);
        if (!asked.pieces.length) return asked.problem;
        var shown = asked.pieces.slice().reverse();
        var two = shown.length > 1;
        var hasPhoto = !!tryPhotoRef.current;
        var auto = hasPhoto && freeLooksRef.current < STYLIST_FREE_LOOKS;
        // A press for the outfit that is already up shows it again only when that puts it on
        // her: her photo is in, no picture is made or on its way, and she has no piece open
        // in front. Otherwise the window is left as it is. Showing it again would start her
        // look over, and each look costs.
        var up = outfitRef.current;
        var same = up && up.pieces.length === asked.pieces.length && up.pieces.every(function(p, i) { return p.id === asked.pieces[i].id; });
        var inFront = openPieceRef.current;
        if (same && !(auto && up.look.current === 'none' && !inFront)) {
          foldCrewChat();
          var how = up.look.current;
          var there = 'That outfit is already on her screen. ';
          if (inFront) there += 'She has ' + inFront.name + ' open in front of it. ';
          if (how === 'made') there += 'The picture of it on her is made. ';
          else if (how === 'making') there += 'The page is still making the picture of it on her. ';
          else if (how === 'reading') there += 'She is adding her photo. ';
          else if (!hasPhoto) there += 'She has not added a photo. ';
          else there += 'Her photo is in, and the picture of the outfit is not made. ' + (auto ? '' : 'It waits for her own tap. ');
          return asked.problem + there + 'The outfit stays there until she closes it.';
        }
        if (auto) freeLooksRef.current += 1;
        var next = { pieces: asked.pieces, note: asked.note, by: member.name, auto: auto, n: Date.now() + Math.random(), look: { current: auto ? 'making' : 'none' } };
        outfitRef.current = next;
        openPieceRef.current = null;
        setSelectedProduct(null);
        setOutfit(next);
        foldCrewChat();
        var total = shown.reduce(function(sum, p) { return sum + p.price; }, 0);
        var said = 'On her screen now: ' + shown.map(function(p) { return p.name + ' ($' + p.price + ')'; }).join(' with ') + (two ? ', $' + total + ' together. ' : '. ');
        if (auto) said += 'Her photo is in, so the page is putting ' + (two ? 'the outfit' : 'it') + ' on her. That takes about ' + (two ? 'half a minute' : '15 seconds') + '. You cannot see the picture.';
        else if (hasPhoto) said += 'Her photo is in. She can tap "see it on me" to try it on.';
        else said += 'She has not added a photo. She can tap "choose a photo" to see it on her.';
        return asked.problem + said;
      };

      const handleAddToCart = (product, colorway, size) => {
        const existingItem = cart.find(
          item => item.product.id === product.id && item.colorway === colorway && item.size === size
        );

        if (existingItem) {
          const newCart = cart.map(item =>
            item === existingItem ? { ...item, qty: item.qty + 1 } : item
          );
          setCart(newCart);
        } else {
          setCart([...cart, { product, colorway, size, qty: 1 }]);
        }
      };

      var navigateTo = function(page) {
        if (page === 'home') {
          setActiveZoneIdx(null);
        }
        setCurrentPage(page);
        window.scrollTo(0, 0);
      };

      var handleSelectCrewMember = function(idx) {
        setActiveZoneIdx(idx);
        setCurrentPage('zone');
        window.scrollTo(0, 0);
      };

      var handleBackToCrew = function() {
        setActiveZoneIdx(null);
        setCurrentPage('home');
        window.scrollTo(0, 0);
      };

      var showNavbar = currentPage !== 'home';
      // Her guide: the crew member whose zone she went into, until she goes back to the crew.
      var guide = currentPage !== 'home' && activeZoneIdx !== null ? CREW_MEMBERS[activeZoneIdx] : null;

      useEffect(function() {
        document.body.classList.toggle('guide-on', !!guide);
        if (window.crewSound) window.crewSound(!!guide);
        return function() {
          document.body.classList.remove('guide-on');
          if (window.crewSound) window.crewSound(false);
        };
      }, [!!guide]);

      // An on-screen keyboard covers the bottom of the screen without telling the page's
      // layout. Note how much, so the chat can sit above it.
      useEffect(function() {
        var vv = window.visualViewport;
        if (!vv) return;
        var note = function() {
          var covered = Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
          document.documentElement.style.setProperty('--kb', (covered > 60 ? covered : 0) + 'px');
        };
        vv.addEventListener('resize', note);
        vv.addEventListener('scroll', note);
        return function() {
          vv.removeEventListener('resize', note);
          vv.removeEventListener('scroll', note);
        };
      }, []);

      return (
        el('div', null,
          showNavbar && el(Navbar, { currentPage: currentPage, navigateTo: navigateTo, cartCount: cart.length }),
          el('div', { className: 'page-main' },
            currentPage === 'home' && el(CharacterSelect, { onSelectCrewMember: handleSelectCrewMember, navigateTo: navigateTo }),
            currentPage === 'zone' && activeZoneIdx !== null && el(CrewZone, { memberIdx: activeZoneIdx, onSelectProduct: setSelectedProduct, onBack: handleBackToCrew, onSwitchZone: function(idx) {
              setActiveZoneIdx(idx);
              window.scrollTo(0, 0);
            } }),
            currentPage === 'shop' && el(ShopPage, { setCurrentPage: navigateTo, onSelectProduct: setSelectedProduct }),
            currentPage === 'studio' && el(DesignStudio, null),
            currentPage === 'cart' && el(CartPage, { cart: cart, setCart: setCart }),
            currentPage !== 'home' && el(Footer, { navigateTo: navigateTo })),
          outfit && el(OutfitWindow, { key: outfit.n, outfit: outfit, onClose: closeOutfit, onView: setSelectedProduct, tryPhoto: tryPhoto, setTryPhoto: setTryPhoto, upRef: outfitRef }),
          selectedProduct && el(ProductDetail, { product: selectedProduct, onClose: () => setSelectedProduct(null), onAddToCart: handleAddToCart, tryPhoto: tryPhoto, setTryPhoto: setTryPhoto }),
          guide && el(GuideChat, { key: guide.name, member: guide, onAddToCart: handleAddToCart, onView: setSelectedProduct, onShowOutfit: handleShowOutfit }))
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App, null));
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
  
</script>
</body>
</html>
