  <script>
    // Safari on a Mac can play a crew member's voice with no sound. The voice library gets
    // sound ready only on an iPhone or iPad, which it tells by touch. It looks as it loads,
    // and again at each tap. crewSound(true) has Safari on a Mac take that same step.
    // crewSound(false) undoes it. The step is on until the library has loaded, then only
    // while a crew member is with her as her guide. ElevenLabs was sent a fix
    // (github.com/elevenlabs/packages/pull/1025). It is not in 1.27.0. When a version has
    // it, take this script out and move the library on.
    (function () {
      var macSafari = false;
      try { macSafari = navigator.vendor === 'Apple Computer, Inc.' && !('ontouchend' in document); } catch (e) {}
      var loaded = false, missing = false, guide = false;
      var set = function (on) {
        if (!macSafari) return;
        try { if (on) document.ontouchend = null; else delete document.ontouchend; } catch (e) {}
      };
      window.crewSound = function (on) { guide = !!on; set(guide || !(loaded || missing)); };
      window.crewVoiceLoaded = function () { loaded = true; set(guide); };
      window.crewVoiceMissing = function () { missing = true; set(guide); };
      // where the library is: 'here', 'coming' (still loading) or 'missing' (it could not be loaded)
      window.crewVoiceState = function () { return loaded ? 'here' : missing ? 'missing' : 'coming'; };
      set(true);
    })();
  </script>

    /* ===== THE BRAND =====
       From the piper & quinn brand style guide, version 1.0 (october 2026).
       Colors are the guide's hex values. Type is Jost: light for headlines, regular for body.
       All copy is lowercase. The wordmark is green with a sky-blue ampersand. */

      --pq-green: #6DC067;
      --sky-blue: #ACD9F4;
      --green-grass: #B1D355;
      --orange-tee: #FBB040;
      --coral: #E8685A;
      --midnight: #1B2A4A;
      --hot-pink: #E84B8A;
      --lavender: #C4A7D7;
      --ocean: #2B7A9E;
      --sunshine: #F7D559;
      --orbit-white: #F8F6F1;
      --city-khaki: #C8B898;
      --wild-black: #2A2A2A;
      --beluga: #808080;

      --ink: var(--wild-black);
      --ink-soft: #5e5e5e;               /* wild black, lightened: small words that must be read */
      --line: rgba(42, 42, 42, 0.1);     /* wild black, as a hairline */
      --line-soft: rgba(42, 42, 42, 0.06);
      --green-press: #5fb259;            /* p&q green, a step darker: a pressed or hovered button */
      --error: #b3261e;
      --radius: 12px;
      --radius-lg: 16px;
      --shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      --shadow-up: 0 12px 32px rgba(42, 42, 42, 0.12);
    }

    * {
      font-family: 'Jost', 'system-ui', 'sans-serif';
    }

    body {

      color: var(--ink);

    /* The wordmark: lowercase jost light, green, the ampersand in sky blue. */
    .wordmark {

    }

    /* ===== HOME: THE TWO SISTERS =====
       The name of the brand, set with the sisters themselves: piper, the ampersand, quinn. */
    .home {
      --face: clamp(112px, 30vw, 248px);
      min-height: calc(100vh - var(--nav-h));
      min-height: calc(100svh - var(--nav-h));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 1rem 4rem;
      text-align: center;
    }

    .home-pair {
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }

    .home-sister {
      width: var(--face);
      display: flex;
      flex-direction: column;
      align-items: center;
      background: none;
      border: none;
      padding: 0;
      font: inherit;
      color: inherit;
      text-transform: lowercase;
      cursor: pointer;
    }

    .home-face {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 0 0 0 4px #fff, 0 0 0 8px var(--zone-accent, var(--pq-green));
      transition: transform 0.3s ease;
    }

    .home-face img,
    .team-face img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
    }

    .home-sister:hover .home-face,
    .team-card:hover .team-face {
      transform: translateY(-6px);
    }

    /* the wordmark's ampersand, level with the middle of the two faces */
    .home-amp {
      flex: none;
      width: clamp(52px, 12vw, 120px);
      margin-top: calc(var(--face) / 2 - 0.55em);
      font-size: clamp(2.1rem, 8vw, 6rem);
      font-weight: 300;
      line-height: 1;
      color: var(--sky-blue);
    }

    .home-name {
      margin-top: 1.25rem;
      font-size: clamp(1.9rem, 5.4vw, 3.4rem);
      font-weight: 300;
      letter-spacing: 0.02em;
      line-height: 1.1;
      color: var(--pq-green);
    }

    .home-role {
      margin-top: 0.35rem;
      min-height: 2.7em;
      font-size: 0.85rem;
      line-height: 1.35;
      color: var(--ink-soft);
    }

    .home-go,
    .team-go {
      margin-top: 0.6rem;
      padding-bottom: 3px;
      font-size: 0.9rem;
      letter-spacing: 0.04em;
      border-bottom: 2px solid var(--zone-accent, var(--pq-green));
    }

    .home-tagline {
      margin: 3rem 0 0;
      font-size: clamp(1.25rem, 3.4vw, 1.6rem);
    }

    .home-skip {
      margin-top: 1.5rem;
      background: none;
      border: none;
      border-bottom: 2px solid var(--sky-blue);
      padding: 0 0 2px;
      font: inherit;
      font-size: 0.9rem;
      letter-spacing: 0.04em;
      color: var(--ink);
      text-transform: lowercase;
      cursor: pointer;
      transition: border-color 0.2s ease;
    }

    .home-skip:hover {
      border-bottom-color: var(--pq-green);
    }

    /* ===== THE TEAM: BACK-UP, ON A TAB OF ITS OWN ===== */
    .team-lede {
      max-width: 520px;
      margin: -1.5rem auto 3rem;
      text-align: center;
      font-size: 1.1rem;
      font-weight: 300;
      line-height: 1.7;
    }

    .team-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 3rem 2rem;
      max-width: 860px;
      margin: 0 auto 2rem;
    }

    .team-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      background: none;
      border: none;
      padding: 0;
      font: inherit;
      color: inherit;
      text-transform: lowercase;
      cursor: pointer;
    }

    .team-face {
      width: 132px;
      height: 132px;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--zone-accent, var(--pq-green));
      transition: transform 0.3s ease;
    }

    .team-name {
      margin-top: 1.1rem;
      font-size: 1.6rem;
      font-weight: 300;
      letter-spacing: 0.02em;
      line-height: 1.1;
    }

    .team-role {
      margin-top: 0.25rem;
      font-size: 0.85rem;
      color: var(--ink-soft);
    }

    .team-helps {
      max-width: 240px;
      margin-top: 0.7rem;
      font-size: 0.98rem;
      line-height: 1.5;
    }

    .team-go {
      margin-top: 0.8rem;
    }

    /* ===== ZONE PAGES ===== */
    .zone-page {
      min-height: 100vh;
      position: relative;
      animation: fadeInZone 0.6s ease;
    }

    @keyframes fadeInZone {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .zone-hero {
      min-height: 400px;
      padding: 3.5rem 1.5rem 3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .zone-hero-content {
      position: relative;
      z-index: 1;
      text-align: center;
      color: var(--ink);
    }

    .zone-hero-avatar {
      width: 104px;
      height: 104px;
      border-radius: 50%;
      margin: 0 auto 1.4rem;
      overflow: hidden;
      box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--zone-accent, var(--pq-green));
      background: #fff;
    }

    .zone-hero-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
    }

    .zone-hero-name {
      font-size: 3rem;
      font-weight: 300;
      letter-spacing: 0.02em;
      line-height: 1.1;
      margin-bottom: 0.5rem;
      text-transform: lowercase;
    }

    .zone-hero-role {
      font-size: 0.78rem;
      font-weight: 400;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin-bottom: 1.25rem;
    }

    .zone-hero-tagline {
      font-size: 1.15rem;
      font-weight: 300;
      font-style: italic;
      max-width: 440px;
      margin: 0 auto;
      line-height: 1.55;
    }

    .zone-section {
      padding: 4rem 2rem;
      max-width: 1000px;
      margin: 0 auto;
    }

    .zone-desc {
      text-align: center;
      font-size: 1.1rem;
      font-weight: 300;
      color: var(--ink);
      line-height: 1.8;
      max-width: 580px;
      margin: 0 auto 3rem;
    }

    .zone-section-title {
      font-size: 1.8rem;
      font-weight: 300;
      letter-spacing: 0.02em;
      text-transform: lowercase;
      margin-bottom: 2.5rem;
      text-align: center;
    }

    .zone-products {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr));
      gap: 2rem;
    }

    .zone-other {
      padding: 2rem 2rem 0;
      text-align: center;
      border-top: 1px solid var(--line);
    }

    .zone-other-label {
      font-size: 0.78rem;
      color: var(--beluga);
      margin-bottom: 0.75rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }

    .zone-nav {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      padding: 1rem 2rem 3rem;
      flex-wrap: wrap;
    }

    .zone-nav-chip {
      font-size: 0.82rem;
      font-weight: 400;
      letter-spacing: 0.04em;
      text-transform: lowercase;
      padding: 8px 18px;
      border-radius: 999px;
      border: 2px solid var(--chip-accent, var(--pq-green));
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      transition: background 0.2s ease;
      font-family: 'Jost', sans-serif;
    }

    .zone-nav-chip:hover {
      background: var(--chip-accent, var(--pq-green));
    }

    @media (max-width: 768px) {
      .zone-hero {
        min-height: 320px;
      }

      .zone-hero-name {
        font-size: 2.3rem;
      }

      .zone-hero-avatar {
        width: 84px;
        height: 84px;
      }
    }

    @media (max-width: 560px) {
      .home {
        padding: 2.25rem 1rem 3rem;
      }

      .home-tagline {
        margin-top: 2.25rem;
      }

      .team-face {
        width: 112px;
        height: 112px;
      }

      .zone-hero {
        min-height: 280px;
        padding: 2.5rem 1rem 2.25rem;
      }

      .zone-hero-name {
        font-size: 2rem;
      }

      .zone-hero-tagline {
        font-size: 1rem;
        padding: 0 0.5rem;
      }
    }

    /* ===== TRY-ON ===== */
    .tryon-open {
      width: 100%;
      padding: 12px 30px;
      background: #fff;
      color: var(--ink);
      border: 2px solid var(--ink);
      border-radius: 999px;
      cursor: pointer;
      font-family: 'Jost', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: lowercase;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .tryon-open:hover {
      background: var(--ink);
      color: #fff;
    }

    .tryon-panel {
      background: var(--orbit-white);
      border-radius: var(--radius);
      padding: 1.25rem;
      position: relative;
    }

    .tryon-file {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .tryon-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 0.6rem;
    }

    .tryon-title {
      font-size: 0.85rem;
      font-weight: 500;
      text-transform: lowercase;
      letter-spacing: 0.05em;
    }

    .tryon-link {
      background: none;
      border: none;
      padding: 6px 0;
      font-family: 'Jost', sans-serif;
      font-size: 0.85rem;
      color: var(--ink);
      cursor: pointer;
      text-decoration: underline;
      text-decoration-color: var(--sky-blue);
      text-decoration-thickness: 2px;
      text-underline-offset: 4px;
      text-transform: lowercase;
    }

    .tryon-link:hover {
      text-decoration-color: var(--pq-green);
    }

    .tryon-link:disabled {
      color: #a8a8a8;
      text-decoration-color: #ddd;
      cursor: default;
    }

    .tryon-tip {
      font-size: 0.85rem;
      color: var(--ink-soft);
      line-height: 1.5;
      margin-bottom: 0.9rem;
    }

    .tryon-photo-row {
      display: flex;
      gap: 0.9rem;
      align-items: center;
      margin-bottom: 0.9rem;
    }

    .tryon-thumb {
      width: 56px;
      height: 84px;
      object-fit: cover;
      object-position: top;
      background: #eee;
      border-radius: 8px;
      flex: none;
    }

    .tryon-photo-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0 1rem;
    }

    .tryon-go {
      width: 100%;
      padding: 11px;
      font-size: 0.85rem;
    }

    .tryon-bar {
      height: 3px;
      background: rgba(42, 42, 42, 0.08);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 0.75rem;
      position: relative;
    }

    .tryon-bar::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: -40%;
      width: 40%;
      background: var(--pq-green);
      animation: tryon-slide 1.2s ease-in-out infinite;
    }

    @keyframes tryon-slide {
      from { left: -40%; }
      to { left: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      .tryon-bar::after {
        animation: none;
        left: 0;
        width: 100%;
        opacity: 0.5;
      }
    }

    .tryon-status {
      font-size: 0.85rem;
      color: var(--ink);
      line-height: 1.5;
    }

    .tryon-status:not(:empty) {
      margin-top: 0.75rem;
    }

    .tryon-status.tryon-error {
      color: var(--error);
    }

    .tryon-note {
      font-size: 0.76rem;
      color: var(--ink-soft);
      line-height: 1.5;
      margin-top: 0.75rem;
    }

    .tryon-view {
      position: absolute;
      left: 50%;
      bottom: 0.9rem;
      transform: translateX(-50%);
      display: flex;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid var(--line);
      border-radius: 999px;
      overflow: hidden;
      white-space: nowrap;
    }

    .tryon-view-btn {
      background: none;
      border: none;
      padding: 9px 15px;
      font-family: 'Jost', sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.04em;
      text-transform: lowercase;
      color: var(--ink-soft);
      cursor: pointer;
    }

    .tryon-view-btn.active {
      background: var(--ink);
      color: #fff;
    }

    /* ===== THE OUTFIT A CREW MEMBER SHOWS ===== */
    .outfit-by {
      font-size: 0.78rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--beluga);
    }

    .outfit-note {
      font-size: 1.15rem;
      font-weight: 300;
      font-style: italic;
      color: var(--ink);
      line-height: 1.5;
      margin-top: 0.5rem;
    }

    .outfit-pieces {
      display: flex;
      flex-direction: column;
    }

    .outfit-piece {
      display: flex;
      align-items: baseline;
      gap: 1rem;
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--line);
    }

    .outfit-piece-name {
      font-size: 1.05rem;
      text-transform: lowercase;
      letter-spacing: 0.02em;
    }

    .outfit-piece-price {
      margin-left: auto;
      font-size: 0.9rem;
      color: var(--ink-soft);
    }

    .outfit-total {
      display: flex;
      justify-content: space-between;
      padding-top: 0.75rem;
      font-size: 0.9rem;
      font-weight: 500;
      text-transform: lowercase;
    }

    .outfit-photos {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 1fr;
      gap: 1px;
      height: 100%;
      min-height: 400px;
    }

    .outfit-photos img {
      width: 100%;
      height: 100%;
      min-height: 0;
      object-fit: cover;
      object-position: top;
    }

    @media (max-width: 768px) {
      .modal-image.tryon-look {
        max-height: 70vh;
      }

      .outfit-photos {
        min-height: 300px;
        height: 50vh;
      }
    }

    /* On a wide screen the details scroll on their own, so the picture stays in view. */
    @media (min-width: 769px) {
      .modal-details {
        max-height: 92vh;
        overflow-y: auto;
      }
    }

    /* ===== YOUR GUIDE: THE CHAT =====
       A crew member comes along as her guide. On a wide screen the chat is a rail down
       the right side. On a narrow one it is a bar at the bottom that opens into a sheet. */
    :root {
      --guide-w: 384px;
      --guide-bar: 64px;
      --nav-h: 76px;
      --kb: 0px;   /* how much an on-screen keyboard covers, set by the page */
    }

    .guide {
      position: fixed;
      right: 0;
      bottom: var(--kb);
      background: #fff;
      display: flex;
      flex-direction: column;
      --guide-accent: var(--pq-green);
      --guide-tint: #e9f6e8;
    }

    .guide-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .guide-head,
    .guide-bar {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.8rem 1rem;
      text-align: left;
    }

    .guide-head {
      border-bottom: 1px solid var(--line);
    }

    /* Narrow screens: the bar, and beside it what she needs while the chat is folded. */
    .guide-top {
      display: flex;
      align-items: center;
      min-height: var(--guide-bar);
      border-bottom: 1px solid transparent;
    }

    .guide-bar {
      flex: 1;
      min-width: 0;
      background: none;
      border: none;
      font: inherit;
      color: inherit;
      text-transform: lowercase;
      cursor: pointer;
    }

    .guide-acts {
      flex: none;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding-right: 0.9rem;
    }

    .guide-close {
      flex: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink-soft);
      font-size: 1.15rem;
      font-weight: 300;
      line-height: 1;
      cursor: pointer;
    }

    .guide-close:hover {
      border-color: var(--ink);
      color: var(--ink);
    }

    /* Narrow screens, chat folded: the guide's last line above the bar, and the pieces in it. */
    .guide-peek {
      display: none;
    }

    .guide-peek-main {
      flex: 1;
      min-width: 0;
    }

    .guide-peek-words {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
      overflow: hidden;
      max-width: 100%;
      padding: 0.5rem 0.85rem;
      background: var(--guide-tint);
      border: none;
      border-radius: 16px;
      border-bottom-left-radius: 6px;
      font: inherit;
      font-size: 0.92rem;
      line-height: 1.4;
      color: inherit;
      text-align: left;
      text-transform: lowercase;
      cursor: pointer;
    }

    .guide-peek-pieces {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.5rem;
      overflow-x: auto;
    }

    .guide-peek-piece {
      flex: none;
      display: flex;
      align-items: center;
      gap: 0.55rem;
      max-width: 200px;
      padding: 4px 12px 4px 4px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      font: inherit;
      font-size: 0.82rem;
      line-height: 1.25;
      color: var(--ink);
      text-align: left;
      text-transform: lowercase;
      cursor: pointer;
    }

    .guide-peek-piece img {
      flex: none;
      width: 40px;
      height: 52px;
      border-radius: 8px;
      object-fit: cover;
      object-position: top 20%;
      background: var(--orbit-white);
    }

    .guide-face {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      overflow: hidden;
      flex: none;
      box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--guide-accent);
      margin: 4px;
    }

    .guide-face img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
    }

    .guide-face .crew-initial {
      font-size: 1.1rem;
    }

    .guide-who {
      flex: 1;
      min-width: 0;
    }

    .guide-name {
      font-size: 1.05rem;
      font-weight: 400;
      letter-spacing: 0.02em;
      line-height: 1.2;
    }

    .guide-state {
      font-size: 0.8rem;
      color: var(--ink-soft);
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .guide-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--guide-accent);
      margin-right: 0.4rem;
      animation: pulse-dot 1.5s ease-in-out infinite;
    }

    .guide-chevron {
      flex: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      color: var(--ink-soft);
    }

    .guide-thread {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    /* each thing in the thread keeps its own height: the thread scrolls, it does not squeeze */
    .guide-thread > * {
      flex-shrink: 0;
    }

    .guide-hello {
      margin: auto 0;
      text-align: center;
      padding: 1rem 0.5rem;
    }

    .guide-hello-line {
      font-size: 1.25rem;
      font-weight: 300;
      line-height: 1.4;
      margin-bottom: 0.4rem;
    }

    .guide-hello-sub {
      font-size: 0.9rem;
      color: var(--ink-soft);
      line-height: 1.5;
      margin-bottom: 1.25rem;
    }

    .guide-chips {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    .guide-chip {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 16px;
      font: inherit;
      font-size: 0.88rem;
      color: var(--ink);
      text-transform: lowercase;
      cursor: pointer;
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .guide-chip:hover:not(:disabled) {
      border-color: var(--guide-accent);
      background: var(--guide-tint);
    }

    .guide-chip:disabled {
      color: #a8a8a8;
      cursor: default;
    }

    .guide-say {
      max-width: 86%;
      padding: 0.6rem 0.9rem;
      border-radius: 16px;
      font-size: 0.95rem;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .guide-say.crew {
      align-self: flex-start;
      background: var(--guide-tint);
      border-bottom-left-radius: 6px;
    }

    .guide-say.me {
      align-self: flex-end;
      background: var(--orbit-white);
      border-bottom-right-radius: 6px;
    }

    .guide-aside {
      align-self: center;
      font-size: 0.78rem;
      color: var(--ink-soft);
      text-align: center;
      padding: 0.2rem 0.5rem;
    }

    .guide-pick {
      align-self: stretch;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: #fff;
      overflow: hidden;
    }

    .guide-pick-by {
      padding: 0.6rem 0.9rem 0;
      font-size: 0.72rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--beluga);
    }

              el('div', { className: 'product-card-image-wrapper' },
                el('img', { src: product.imageUrl, alt: product.name, className: 'product-image' })),
              el('div', { className: 'product-info' },
                el('div', { className: 'product-name' }, product.name),
                el('div', { className: 'product-price' }, '$' + product.price)));
          }))),
        el('div', { className: 'zone-other' }, el('div', { className: 'zone-other-label' }, 'visit another zone')),
        el('div', { className: 'zone-nav' },
          CREW_MEMBERS.map(function(m, idx) {
            if (idx === memberIdx || m.team) return null;
            return el('button', { key: m.name, className: 'zone-nav-chip', style: { '--chip-accent': m.accent }, onClick: function() { onSwitchZone(idx); } }, m.name.toLowerCase() + "'s zone");
          }),
          el('button', { className: 'zone-nav-chip', onClick: function() { navigateTo('team'); } }, 'the team')));
    }

    function Footer({ navigateTo }) {
      var link = function(page, words) {
        return el('button', { className: 'footer-link', onClick: function() { navigateTo(page); } }, words);
      };
      return el('div', { className: 'footer' },
        el('div', { className: 'color-rule' }),
        el('div', { className: 'footer-content' },
          el('div', null,
            el('div', { className: 'footer-brand' }, el(Wordmark, null)),
            el('div', { className: 'tagline footer-tagline' }, 'dress bold.'),
            el('div', { className: 'footer-place' }, 'fashion by sisters. san francisco, california.')),
          el('div', { className: 'footer-links' }, link('home', 'home'), link('shop', 'shop'), link('studio', 'studio'), link('team', 'team'), link('cart', 'cart'))),
        el('div', { className: 'footer-legal' }, '© 2026 piper & quinn'));
    }

    function App() {
      const [currentPage, setCurrentPage] = useState('home');   // home | zone | shop | studio | team | cart
      const [cart, setCart] = useState([]);
      const [piece, setPiece] = useState(null);                 // the piece window that is open (see ProductDetail)
      const [activeZoneIdx, setActiveZoneIdx] = useState(null); // whose page she is on, on the zone page
      const [guideIdx, setGuideIdx] = useState(null);           // her guide: with her on every page until she picks another or closes the chat
      const [tryPhoto, setTryPhoto] = useState(null);
      const [outfit, setOutfit] = useState(null);
      var tryPhotoRef = React.useRef(null);
      tryPhotoRef.current = tryPhoto;
      var freeLooksRef = React.useRef(0);
      // The outfit that is up, as of the last press or close. Kept here and set as things
      // happen: a second press can arrive before the page has drawn the first. Each outfit
      // carries how her look in its window stands, in `look` (see TryOn). The piece window,
      // the cart and the page she is on are kept the same way.
      var outfitRef = React.useRef(null);
      var pieceRef = React.useRef(null);
      var pieceCount = React.useRef(0);
      var cartRef = React.useRef([]);
      var pageRef = React.useRef('home');
      var zoneRef = React.useRef(null);
      var quietPage = React.useRef(true); // the first page, and a page her guide took her to, need no note

      var closeOutfit = function() {
        outfitRef.current = null;
        setOutfit(null);
      };

      var underWay = function(look) { return !!look && (look.current === 'making' || look.current === 'reading'); };

      // What she is trying on right now, in words: a picture is being made, or she is choosing
      // her photo. Closing that window would stop it. '' when nothing is under way.
      var tryingOn = function() {
        if (pieceRef.current && underWay(pieceRef.current.look)) return pieceRef.current.product.name;
        if (outfitRef.current && underWay(outfitRef.current.look)) return 'an outfit';
        return '';
      };

      var openPiece = function(product, color) {
        var next = { product: product, color: color || null, colorN: 0, n: ++pieceCount.current, look: { current: 'none' }, seen: { color: color || product.colorways[0], size: null } };
        pieceRef.current = next;
        setPiece(next);
        return next;
      };

      // Close the piece window. With `n`: only if that opening of it is still the one that is up.
      var closePiece = function(n) {
        if (!pieceRef.current || (n != null && pieceRef.current.n !== n)) return false;
        pieceRef.current = null;
        setPiece(null);
        return true;
      };

      // She opened a piece herself: from the shop, a zone, an outfit, or a card in the chat.
      var viewPiece = function(product) {
        if (pieceRef.current && pieceRef.current.product === product) return;
        openPiece(product);
        tellCrew('She opened ' + product.name + ' on her screen.');
      };

      // "view" on a piece in the chat. On a narrow screen the open chat would cover the
      // piece's window, so the chat folds down to its bar.
      var viewFromChat = function(product) {
        viewPiece(product);
        foldCrewChat();
      };

      var putCart = function(next) {
        cartRef.current = next;
        setCart(next);
      };

      var handleAddToCart = function(product, colorway, size) {
        var now = cartRef.current;
        var existing = now.find(function(item) { return item.product.id === product.id && item.colorway === colorway && item.size === size; });
        putCart(existing
          ? now.map(function(item) { return item === existing ? Object.assign({}, item, { qty: item.qty + 1 }) : item; })
          : now.concat([{ product: product, colorway: colorway, size: size, qty: 1 }]));
      };

      // Her guide pressed show_piece, or the page is answering her own "show me". Puts the
      // piece on her screen and says what happened: { say, piece, color }.
      var handleShowPiece = function(params) {
        params = params || {};
        var named = params.piece != null && String(params.piece).trim() !== '';
        var p = named ? findPiece(params.piece) : null;
        if (!p) {
          return { say: (named ? 'No piece is called ' + String(params.piece).slice(0, 40) + '. ' : 'No piece was named. ') + 'The pieces are: ' + PRODUCTS.map(pieceKey).join(', ') + '.' };
        }
        var asked = params.color != null && String(params.color).trim() !== '';
        var color = asked ? findColor(params.color, p) : null;
        var notIn = asked && !color ? p.name + ' does not come in ' + String(params.color).slice(0, 30) + '. ' : '';
        var comes = 'It comes in ' + listWords(p.colorways.map(colorName)) + ', in sizes XXS to XL.';
        var up = pieceRef.current;
        if (up && up.product === p) {
          foldCrewChat();
          if (color && up.seen.color !== color) {
            var again = Object.assign({}, up, { color: color, colorN: up.colorN + 1 });
            pieceRef.current = again;
            setPiece(again);
            return { say: p.name + ' is on her screen, now in ' + colorName(color) + '. ' + comes, piece: p, color: color };
          }
          return { say: notIn + p.name + ' is already on her screen, in ' + colorName(up.seen.color) + '. ' + comes, piece: p, color: color };
        }
        // A piece she is trying on is left alone: closing its window would stop the picture.
        if (up && underWay(up.look)) {
          return { say: notIn + 'She is in the middle of trying on ' + up.product.name + ', so her screen was left as it is. ' + p.name + ' is in the chat for her to open.', piece: p, color: color };
        }
        var opened = openPiece(p, color);
        foldCrewChat();
        return { say: notIn + 'On her screen now: ' + p.name + ' ($' + p.price + '), in ' + colorName(opened.seen.color) + '. ' + comes, piece: p, color: color };
      };

      // Her guide pressed add_to_cart. Adds only with a size: one that was said, or the one she
      // has picked in the piece's window. Says what happened: { say, added }.
      var handleGuideAdd = function(params) {
        params = params || {};
        var named = params.piece != null && String(params.piece).trim() !== '';
        var p = named ? findPiece(params.piece) : null;
        if (!p) {
          return { say: (named ? 'No piece is called ' + String(params.piece).slice(0, 40) + '. ' : 'No piece was named. ') + 'Nothing was added. The pieces are: ' + PRODUCTS.map(pieceKey).join(', ') + '.' };
        }
        var up = pieceRef.current && pieceRef.current.product === p ? pieceRef.current : null;
        var sizeSaid = params.size != null && String(params.size).trim() !== '';
        var size = sizeSaid ? findSize(params.size, p) : (up ? up.seen.size : null);
        if (!size) {
          return { say: (sizeSaid ? String(params.size).slice(0, 20) + ' is not a size. ' : 'No size was given. ') + 'Nothing was added. Ask her which size: XXS, XS, S, M, L or XL. If she is not sure, she can tap "what\'s my size?" on the piece.' };
        }
        var colorSaid = params.color != null && String(params.color).trim() !== '';
        var color = colorSaid ? findColor(params.color, p) : null;
        if (colorSaid && !color) {
          return { say: p.name + ' does not come in ' + String(params.color).slice(0, 30) + '. Nothing was added. It comes in ' + listWords(p.colorways.map(colorName)) + '. Ask her which one.' };
        }
        if (!color) color = up ? up.seen.color : p.colorways[0];
        handleAddToCart(p, color, size);
        return {
          say: 'Added to her cart: ' + p.name + ', size ' + size.toUpperCase() + ', in ' + colorName(color) + ', $' + p.price + '. ' + cartWords(cartRef.current) + ' The shop is a preview, so nothing can be bought yet.',
          added: { product: p, color: color, size: size },
        };
      };

      var navigateTo = function(page) {
        zoneRef.current = null;
        pageRef.current = page;
        setActiveZoneIdx(null);
        setCurrentPage(page);
        window.scrollTo(0, 0);
      };

      // Her guide pressed go_to. Takes her to the page, and says in words what happened.
      var handleGoTo = function(params) {
        var said = String((params && params.page) || '').toLowerCase().replace(/[^a-z]/g, '').replace(/^the/, '').replace(/page$/, '');
        var page = PAGE_WORDS[said] ? said : PAGE_ALSO[said];
        if (!page) return (said ? 'There is no page called ' + said.slice(0, 20) + '. ' : 'No page was named. ') + 'The pages are: home, shop, studio, team and cart.';
        var busy = tryingOn();
        if (busy) return 'She is in the middle of trying on ' + busy + ', so her screen was left as it is. Offer again when her picture is done.';
        closePiece();
        closeOutfit();
        if (pageRef.current !== page) quietPage.current = true;
        navigateTo(page);
        foldCrewChat();
        return 'She is now on ' + PAGE_WORDS[page] + '.' + (page === 'cart' ? ' ' + cartWords(cartRef.current) : '');
      };

      // A crew member pressed show_outfit. Show it, and answer her with what happened.
      var handleShowOutfit = function(params, member) {
        var asked = readOutfit(params);
        if (!asked.pieces.length) return asked.problem;
        var shown = asked.pieces.slice().reverse();
        var two = shown.length > 1;
        var hasPhoto = !!tryPhotoRef.current;
        var auto = hasPhoto && freeLooksRef.current < STYLIST_FREE_LOOKS;
        // A press for the outfit that is already up shows it again only when that puts it on
        // her: her photo is in, no picture is made or on its way, and she has no piece open
        // in front. Otherwise the window is left as it is. Showing it again would start her
        // look over, and each look costs.
        var up = outfitRef.current;
        var same = up && up.pieces.length === asked.pieces.length && up.pieces.every(function(p, i) { return p.id === asked.pieces[i].id; });
        var inFront = pieceRef.current ? pieceRef.current.product : null;
        if (same && !(auto && up.look.current === 'none' && !inFront)) {
          foldCrewChat();
          var how = up.look.current;
          var there = 'That outfit is already on her screen. ';
          if (inFront) there += 'She has ' + inFront.name + ' open in front of it. ';
          if (how === 'made') there += 'The picture of it on her is made. ';
          else if (how === 'making') there += 'The page is still making the picture of it on her. ';
          else if (how === 'reading') there += 'She is adding her photo. ';
          else if (!hasPhoto) there += 'She has not added a photo. ';
          else there += 'Her photo is in, and the picture of the outfit is not made. ' + (auto ? '' : 'It waits for her own tap. ');
          return asked.problem + there + 'The outfit stays there until she closes it.';
        }
        // A piece she is trying on is left alone: closing its window would stop the picture.
        if (inFront && underWay(pieceRef.current.look)) {
          return asked.problem + 'She is in the middle of trying on ' + inFront.name + ', so her screen was left as it is. Offer the outfit again when her picture is done.';
        }
        if (auto) freeLooksRef.current += 1;
        var next = { pieces: asked.pieces, note: asked.note, by: member.name, auto: auto, n: Date.now() + Math.random(), look: { current: auto ? 'making' : 'none' } };
        outfitRef.current = next;
        closePiece();
        setOutfit(next);
        foldCrewChat();
        var total = shown.reduce(function(sum, p) { return sum + p.price; }, 0);
        var said = 'On her screen now: ' + shown.map(function(p) { return p.name + ' ($' + p.price + ')'; }).join(' with ') + (two ? ', $' + total + ' together. ' : '. ');
        if (auto) said += 'Her photo is in, so the page is putting ' + (two ? 'the outfit' : 'it') + ' on her. That takes about ' + (two ? 'half a minute' : '15 seconds') + '. You cannot see the picture.';
        else if (hasPhoto) said += 'Her photo is in. She can tap "see it on me" to try it on.';
        else said += 'She has not added a photo. She can tap "choose a photo" to see it on her.';
        return asked.problem + said;
      };

      // Where she is, in words for her guide, who cannot see the screen.
      var whereNow = function() {
        var zone = pageRef.current === 'zone' && zoneRef.current !== null ? CREW_MEMBERS[zoneRef.current] : null;
        var said = 'She is on ' + (zone ? zone.name + "'s page, with " + zone.name + "'s picks" : PAGE_WORDS[pageRef.current] || 'the site') + '. ';
        if (pieceRef.current) said += pieceRef.current.product.name + ' is open on her screen. ';
        else if (outfitRef.current) said += 'An outfit is open on her screen: ' + outfitRef.current.pieces.slice().reverse().map(function(p) { return p.name; }).join(' with ') + '. ';
        return said + cartWords(cartRef.current);
      };

      // Going into a crew member's page makes that member her guide.
      var handleSelectCrewMember = function(idx) {
        zoneRef.current = idx;
        pageRef.current = 'zone';
        setActiveZoneIdx(idx);
        setGuideIdx(idx);
        setCurrentPage('zone');
        window.scrollTo(0, 0);
      };

      var guide = guideIdx !== null ? CREW_MEMBERS[guideIdx] : null;

      useEffect(function() {
        document.body.classList.toggle('guide-on', !!guide);
        if (window.crewSound) window.crewSound(!!guide);
        return function() {
          document.body.classList.remove('guide-on');
          if (window.crewSound) window.crewSound(false);
        };
      }, [!!guide]);

      // Her guide cannot see the screen: say where she has gone.
      useEffect(function() {
        if (quietPage.current) { quietPage.current = false; return; }
        var zone = currentPage === 'zone' && activeZoneIdx !== null ? CREW_MEMBERS[activeZoneIdx] : null;
        tellCrew('She went to ' + (zone ? zone.name + "'s page, with " + zone.name + "'s picks" : PAGE_WORDS[currentPage] || 'another page') + '.' + (currentPage === 'cart' ? ' ' + cartWords(cartRef.current) : ''));
      }, [currentPage, activeZoneIdx]);

      // An on-screen keyboard covers the bottom of the screen without telling the page's
      // layout. Note how much, so the chat can sit above it.
      useEffect(function() {
        var vv = window.visualViewport;
        if (!vv) return;
        var note = function() {
          var covered = Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
          document.documentElement.style.setProperty('--kb', (covered > 60 ? covered : 0) + 'px');
        };
        vv.addEventListener('resize', note);
        vv.addEventListener('scroll', note);
        return function() {
          vv.removeEventListener('resize', note);
          vv.removeEventListener('scroll', note);
        };
      }, []);

      var acts = { showOutfit: handleShowOutfit, showPiece: handleShowPiece, addToCart: handleGuideAdd, goTo: handleGoTo, where: whereNow };

      return (
        el('div', null,
          el(Navbar, { currentPage: currentPage, navigateTo: navigateTo, cartCount: cart.length }),
          el('div', { className: 'page-main' },
            currentPage === 'home' && el(HomePage, { onSelectCrewMember: handleSelectCrewMember, navigateTo: navigateTo }),
            currentPage === 'zone' && activeZoneIdx !== null && el(CrewZone, { memberIdx: activeZoneIdx, onSelectProduct: viewPiece, onSwitchZone: handleSelectCrewMember, navigateTo: navigateTo, isGuide: guideIdx === activeZoneIdx, onGuide: function() { setGuideIdx(activeZoneIdx); } }),
            currentPage === 'shop' && el(ShopPage, { setCurrentPage: navigateTo, onSelectProduct: viewPiece }),
            currentPage === 'studio' && el(DesignStudio, null),
            currentPage === 'team' && el(TeamPage, { onSelectCrewMember: handleSelectCrewMember }),
            currentPage === 'cart' && el(CartPage, { cart: cart, setCart: putCart }),
            el(Footer, { navigateTo: navigateTo })),
          outfit && el(OutfitWindow, { key: outfit.n, outfit: outfit, onClose: closeOutfit, onView: viewPiece, tryPhoto: tryPhoto, setTryPhoto: setTryPhoto, upRef: outfitRef }),
          piece && el(ProductDetail, {
            key: piece.n,
            ask: piece,
            onClose: function() { if (closePiece(piece.n)) tellCrew('She closed ' + piece.product.name + '.'); },
            onAddToCart: function(product, colorway, size) {
              handleAddToCart(product, colorway, size);
              tellCrew('She added ' + product.name + ' to her cart: size ' + String(size).toUpperCase() + ', in ' + colorName(colorway) + '.');
            },
            tryPhoto: tryPhoto,
            setTryPhoto: setTryPhoto,
          }),
          guide && el(GuideChat, { key: guide.name, member: guide, onAddToCart: handleAddToCart, onView: viewFromChat, acts: acts, onClose: function() { setGuideIdx(null); } }))
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App, null));
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
  
</script>
</body>
</html>
